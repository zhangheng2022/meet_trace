version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      flutter-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: "/tool/patrol_mcp"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      patrol-mcp-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    ignore:
      # AGP 与 Gradle 的次版本必须按官方兼容矩阵协调升级。
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
