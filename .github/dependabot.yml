version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      flutter-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: "/tool/patrol_mcp"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      patrol-mcp-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    allow:
      # 常规更新只自动跟进已验证版本线内的补丁；安全更新不受
      # allow.update-types 限制，仍可提出跨版本修复供人工评估。
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-patch
      - dependency-name: gradle-wrapper
        update-types:
          - version-update:semver-patch
      - dependency-name: org.jetbrains.kotlin.android
