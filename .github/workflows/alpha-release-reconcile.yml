name: Alpha Release Reconciler

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  repository_dispatch:
    types: [alpha-release-reconcile]

permissions: {}

concurrency:
  group: alpha-release-reconcile
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve active immutable Draft candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      # GitHub only includes Draft releases for callers with repository push access.
      contents: write
    outputs:
      found: ${{ steps.candidate.outputs.found }}
      release_id: ${{ steps.candidate.outputs.release_id }}
      source_run_id: ${{ steps.candidate.outputs.source_run_id }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      marketing_version: ${{ steps.candidate.outputs.marketing_version }}
      build_number: ${{ steps.candidate.outputs.build_number }}
      android_artifact_sha256: ${{ steps.candidate.outputs.android_artifact_sha256 }}
      windows_bundle_name: ${{ steps.candidate.outputs.windows_bundle_name }}
      windows_artifact_name: ${{ steps.candidate.outputs.windows_artifact_name }}
      windows_artifact_sha256: ${{ steps.candidate.outputs.windows_artifact_sha256 }}
      windows_package_version: ${{ steps.candidate.outputs.windows_package_version }}
    steps:
      - name: Checkout validated master workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve dispatch or scheduled candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          DISPATCH_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          DISPATCH_CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/alpha-releases.json"
          releases_json="$(jq -c 'add' "$RUNNER_TEMP/alpha-releases.json")"
          if [[ "$EVENT_NAME" == repository_dispatch ]]; then
            release_id="$DISPATCH_RELEASE_ID"
            python3 tool/release/active_alpha_candidate.py \
              --releases "$RUNNER_TEMP/alpha-releases.json" \
              --require-selected "$release_id"
          else
            release_id="$(python3 tool/release/active_alpha_candidate.py \
              --releases "$RUNNER_TEMP/alpha-releases.json" \
              --select)"
            if [[ -z "$release_id" ]]; then
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          [[ "$release_id" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          release_json="$(jq -cer --arg release "$release_id" '[.[] | select(.draft == true and .prerelease == true and .tag_name == $release)] | if length == 1 then .[0] else error("expected exactly one immutable Draft release") end' <<<"$releases_json")"
          mkdir -p build/reconcile/discovery build/reconcile/windows
          manifest_asset_id="$(jq -er '[.assets[] | select(.name == "candidate-manifest.json" and .state == "uploaded")] | if length == 1 then .[0].id else error("expected exactly one candidate manifest asset") end' <<<"$release_json")"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id" \
            > build/reconcile/discovery/candidate-manifest.json
          release_manifest=build/reconcile/discovery/candidate-manifest.json
          candidate_sha="$(jq -er .commitSha "$release_manifest")"
          release_marketing_version="$(jq -er .marketingVersion "$release_manifest")"
          release_build_number="$(jq -er .buildNumber "$release_manifest")"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$release_build_number" =~ ^[1-9][0-9]*$ ]]
          jq -e --arg release "$release_id" --arg sha "$candidate_sha" --arg repository "$GITHUB_REPOSITORY" '
            .schemaVersion == 2 and .platform == "android" and
            .releaseId == $release and .commitSha == $sha and
            .distribution.repository == $repository and
            .distribution.releaseState == "draft" and
            .distribution.publiclyInstallable == false
          ' "$release_manifest" >/dev/null
          if [[ "$EVENT_NAME" == repository_dispatch ]]; then
            [[ "$DISPATCH_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$DISPATCH_CANDIDATE_SHA" == "$candidate_sha" ]]
            candidate_runs=("$DISPATCH_SOURCE_RUN_ID")
          else
            mapfile -t candidate_runs < <(
              gh run list --repo "$GITHUB_REPOSITORY" \
                --workflow alpha-release.yml --branch master --limit 100 \
                --json databaseId,status,conclusion \
                --jq '.[] | select(.status == "completed" and .conclusion == "success") | .databaseId'
            )
          fi
          git fetch --force origin "refs/tags/$release_id:refs/tags/$release_id"
          [[ "$(git cat-file -t "refs/tags/$release_id")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$release_id^{}")" == "$candidate_sha" ]]
          git merge-base --is-ancestor "$candidate_sha" origin/master

          source_run_id=''
          manifest=''
          windows_bundle_name=''
          for candidate_run_id in "${candidate_runs[@]}"; do
            source_run="$(gh run view "$candidate_run_id" --repo "$GITHUB_REPOSITORY" --json workflowName,event,headBranch,headSha,jobs)"
            if ! jq -e '
              .workflowName == "Alpha Release" and .event == "workflow_dispatch" and
              .headBranch == "master" and (.headSha | test("^[0-9a-f]{40}$")) and
              ([.jobs[] | select(.name == "Build, sign, and stage Android Alpha" and .conclusion == "success")] | length == 1) and
              ([.jobs[] | select(.name == "Validate signed Android candidate once on Firebase ARM64" and .conclusion == "success")] | length == 1) and
              ([.jobs[] | select(.name == "Build, sign, and upload iOS app" and .conclusion == "success")] | length == 1) and
              ([.jobs[] | select(.name == "Build Microsoft Store Windows candidate" and .conclusion == "success")] | length == 1)
            ' <<<"$source_run" >/dev/null; then
              continue
            fi
            source_head_sha="$(jq -er .headSha <<<"$source_run")"
            if ! git cat-file -e "$source_head_sha^{commit}" 2>/dev/null ||
               ! git merge-base --is-ancestor "$candidate_sha" "$source_head_sha"; then
              continue
            fi

            artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$candidate_run_id/artifacts?per_page=100")"
            windows_id="$(jq -r '[.artifacts[] | select(.expired == false and (.name | startswith("meettrace-windows-store-")))] | sort_by(.created_at, .id) | last | .id // empty' <<<"$artifacts")"
            [[ "$windows_id" =~ ^[1-9][0-9]*$ ]] || continue

            candidate_dir="build/reconcile/candidate-$candidate_run_id"
            mkdir -p "$candidate_dir"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$windows_id/zip" > "$candidate_dir/windows.zip"
            unzip -qp "$candidate_dir/windows.zip" candidate-manifest.json > "$candidate_dir/candidate-manifest.json"
            candidate_manifest="$candidate_dir/candidate-manifest.json"
            if ! jq -e --arg release "$release_id" --arg sha "$candidate_sha" --argjson run "$candidate_run_id" --arg marketing "$release_marketing_version" --arg build "$release_build_number" '
              .releaseId == $release and .commitSha == $sha and (.runId | tostring) == ($run | tostring) and
              .marketingVersion == $marketing and (.buildNumber | tostring) == $build and
              .platform == "windows" and .distribution == "microsoftStore" and
              .artifact.storeSubmissionCandidate == true and
              .artifact.publiclyInstallable == false and
              (.artifact.sha256 | test("^[0-9a-f]{64}$"))
            ' "$candidate_manifest" >/dev/null; then
              continue
            fi
            source_run_id="$candidate_run_id"
            manifest="$candidate_manifest"
            windows_bundle_name="$(jq -er --argjson id "$windows_id" '.artifacts[] | select(.id == $id) | .name' <<<"$artifacts")"
            break
          done
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "No successful Alpha Release run carries the exact immutable candidate" >&2
            exit 1
          }
          {
            echo "found=true"
            echo "source_run_id=$source_run_id"
            echo "candidate_sha=$candidate_sha"
            echo "marketing_version=$(jq -er .marketingVersion "$manifest")"
            echo "build_number=$(jq -er .buildNumber "$manifest")"
            echo "android_artifact_sha256=$(jq -er .artifact.sha256 "$release_manifest")"
            echo "windows_bundle_name=$windows_bundle_name"
            echo "windows_artifact_name=$(jq -er .artifact.name "$manifest")"
            echo "windows_artifact_sha256=$(jq -er .artifact.sha256 "$manifest")"
            echo "windows_package_version=$(jq -er .packageVersion "$manifest")"
          } >> "$GITHUB_OUTPUT"

  testflight_status:
    name: Reconcile TestFlight external review and Testing
    if: needs.resolve.outputs.found == 'true'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: testflight
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.status.outputs.ready }}
      blocked: ${{ steps.status.outputs.blocked }}
      summary: ${{ steps.status.outputs.summary }}
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      MARKETING_VERSION: ${{ needs.resolve.outputs.marketing_version }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
      TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
      TESTFLIGHT_PUBLIC_LINK: ${{ vars.TESTFLIGHT_PUBLIC_LINK }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
    steps:
      - name: Checkout reviewed reconciler implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Set up Ruby 3.4.10
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ".ruby-version"

      - name: Validate App Store Connect status client
        run: ruby -c tool/release/app_store_connect_status.rb

      - name: Set up Flutter for receipt verification
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Query App Store Connect and classify exact build
        id: status
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64 TESTFLIGHT_EXTERNAL_GROUP TESTFLIGHT_PUBLIC_LINK; do
            value="${!name-}"
            [[ -n "${value//[[:space:]]/}" ]] || { echo "Missing TestFlight automation value: $name" >&2; exit 1; }
          done
          key_file="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          trap 'rm -f -- "$key_file" "$RUNNER_TEMP/testflight-status.json"' EXIT
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ruby tool/release/app_store_connect_status.rb \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key "$key_file" \
            --bundle-id com.meettrace.app \
            --marketing-version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --external-group "$TESTFLIGHT_EXTERNAL_GROUP" \
            --public-link "$TESTFLIGHT_PUBLIC_LINK" \
            --diagnostic "$RUNNER_TEMP/testflight-query-diagnostic.json" \
            > "$RUNNER_TEMP/testflight-status.json"
          processing="$(jq -er .processingState "$RUNNER_TEMP/testflight-status.json")"
          review="$(jq -er .betaReviewState "$RUNNER_TEMP/testflight-status.json")"
          external="$(jq -er .externalBuildState "$RUNNER_TEMP/testflight-status.json")"
          testing="$(jq -er .testing "$RUNNER_TEMP/testflight-status.json")"
          ready=false
          blocked=false
          if [[ ! "$processing" =~ ^[A-Z0-9_]{1,128}$ ||
                ! "$review" =~ ^[A-Z0-9_]{1,128}$ ||
                ! "$external" =~ ^[A-Z0-9_]{1,128}$ ||
                ! "$testing" =~ ^(true|false)$ ]]; then
            processing=INVALID_RESPONSE
            review=INVALID_RESPONSE
            external=INVALID_RESPONSE
            testing=false
            blocked=true
          else
            case "$processing/$review/$external/$testing" in
              VALID/APPROVED/IN_BETA_TESTING/true)
                ready=true
                ;;
              FAILED/*|INVALID/*|*/REJECTED/*|*/*/PROCESSING_EXCEPTION/*|*/*/MISSING_EXPORT_COMPLIANCE/*|*/*/EXPIRED/*|*/*/BETA_REJECTED/*|*/*/NOT_APPLICABLE/*)
                blocked=true
                ;;
              PROCESSING/*|VALID/NOT_SUBMITTED/READY_FOR_BETA_SUBMISSION/false|VALID/WAITING_FOR_REVIEW/*|VALID/IN_REVIEW/*|VALID/APPROVED/READY_FOR_BETA_SUBMISSION/false|VALID/APPROVED/IN_EXPORT_COMPLIANCE_REVIEW/false|VALID/APPROVED/WAITING_FOR_BETA_REVIEW/false|VALID/APPROVED/IN_BETA_REVIEW/false|VALID/APPROVED/BETA_APPROVED/false|VALID/APPROVED/READY_FOR_BETA_TESTING/false)
                ;;
              *)
                blocked=true
                ;;
            esac
          fi
          if [[ "$ready" == true ]]; then
            dart run tool/release/verify_testflight_submission.dart \
              --input "$RUNNER_TEMP/testflight-status.json" \
              --output build/reconcile/testflight-production-receipt.json \
              --bundle-id com.meettrace.app \
              --marketing-version "$MARKETING_VERSION" \
              --build-number "$BUILD_NUMBER" \
              --external-group "$TESTFLIGHT_EXTERNAL_GROUP" \
              --public-link "$TESTFLIGHT_PUBLIC_LINK" \
              --release-id "$RELEASE_ID" \
              --candidate-sha "$CANDIDATE_SHA" \
              --source-run-id "$SOURCE_RUN_ID" \
              --verified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          {
            echo "ready=$ready"
            echo "blocked=$blocked"
            echo "summary=processing=$processing review=$review external=$external testing=$testing"
          } >> "$GITHUB_OUTPUT"

      - name: Upload safe TestFlight query diagnostic
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-testflight-query-diagnostic-${{ needs.resolve.outputs.release_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-query-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload safe TestFlight receipt
        if: steps.status.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-reconcile-testflight-${{ needs.resolve.outputs.release_id }}
          path: build/reconcile/testflight-production-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  microsoft_store_flight:
    name: Submit or recover Microsoft Store Package Flight
    if: needs.resolve.outputs.found == 'true'
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 30
    environment: microsoft-store
    permissions:
      actions: read
      contents: read
    outputs:
      submission_id: ${{ steps.receipt.outputs.submission_id }}
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      PARTNER_CENTER_FLIGHT_ID: ${{ vars.PARTNER_CENTER_FLIGHT_ID }}
    steps:
      - name: Checkout reviewed reconciler implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Set up Microsoft Store CLI v0.4.1
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.1

      - name: Download immutable Windows candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.resolve.outputs.windows_bundle_name }}
          path: build/reconcile/windows-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.source_run_id }}

      - name: Submit, reuse, or recover fixed Package Flight
        id: receipt
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'build/reconcile/windows-candidate/candidate-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $candidatePath = Join-Path 'build/reconcile/windows-candidate' $manifest.artifact.name
          ./tool/release/submit_microsoft_store_flight.ps1 `
            -CandidatePath $candidatePath `
            -ManifestPath $manifestPath `
            -OutputPath build/reconcile/windows-flight-request.json `
            -ProductId 9PHHSJMWK06G `
            -FlightId $env:PARTNER_CENTER_FLIGHT_ID `
            -ReleaseId $env:RELEASE_ID `
            -CandidateSha $env:CANDIDATE_SHA `
            -SourceRunId $env:SOURCE_RUN_ID `
            -TenantId $env:PARTNER_CENTER_TENANT_ID `
            -SellerId $env:PARTNER_CENTER_SELLER_ID `
            -ClientId $env:PARTNER_CENTER_CLIENT_ID `
            -ClientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          $receipt = Get-Content `
            -LiteralPath build/reconcile/windows-flight-request.json `
            -Raw | ConvertFrom-Json
          if ([string]$receipt.submissionId -notmatch '^[1-9][0-9]*$') {
            throw 'Package Flight receipt is missing a valid submission ID.'
          }
          "submission_id=$($receipt.submissionId)" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Remove Microsoft Store CLI credentials
        if: always()
        shell: pwsh
        env:
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
        run: |
          $source = @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;

          public static class MeetTraceCredentialCleanup
          {
              [DllImport("advapi32.dll", EntryPoint = "CredDeleteW",
                  CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern bool CredDelete(string target, int type, int flags);

              public static void Delete(string target)
              {
                  if (!CredDelete(target, 1, 0))
                  {
                      int error = Marshal.GetLastWin32Error();
                      if (error != 1168)
                      {
                          throw new Win32Exception(error);
                      }
                  }
              }
          }
          '@
          Add-Type -TypeDefinition $source
          if (-not [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_CLIENT_ID)) {
            [MeetTraceCredentialCleanup]::Delete(
              "MicrosoftStoreCli:user=$($env:PARTNER_CENTER_CLIENT_ID)"
            )
          }

      - name: Upload Package Flight request evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-reconcile-flight-request-${{ needs.resolve.outputs.release_id }}
          path: build/reconcile/windows-flight-request.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  microsoft_store_status:
    name: Reconcile Microsoft Store Flight and production
    if: needs.resolve.outputs.found == 'true'
    needs: [resolve, microsoft_store_flight]
    runs-on: windows-2025
    timeout-minutes: 15
    environment: microsoft-store
    permissions:
      actions: read
      contents: read
    outputs:
      flight_ready: ${{ steps.status.outputs.flight_ready }}
      flight_blocked: ${{ steps.status.outputs.flight_blocked }}
      flight_summary: ${{ steps.status.outputs.flight_summary }}
      production_ready: ${{ steps.status.outputs.production_ready }}
      production_present: ${{ steps.status.outputs.production_present }}
      production_blocked: ${{ steps.status.outputs.production_blocked }}
      production_summary: ${{ steps.status.outputs.production_summary }}
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      WINDOWS_ARTIFACT_NAME: ${{ needs.resolve.outputs.windows_artifact_name }}
      WINDOWS_PACKAGE_VERSION: ${{ needs.resolve.outputs.windows_package_version }}
      PARTNER_CENTER_FLIGHT_ID: ${{ vars.PARTNER_CENTER_FLIGHT_ID }}
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
      PARTNER_CENTER_FLIGHT_SUBMISSION_ID: ${{ needs.microsoft_store_flight.outputs.submission_id }}
    steps:
      - name: Checkout reviewed reconciler implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Set up Flutter for receipt verification
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Query and classify exact Store submissions
        id: status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
              'PARTNER_CENTER_TENANT_ID',
              'PARTNER_CENTER_CLIENT_ID',
              'PARTNER_CENTER_CLIENT_SECRET',
              'PARTNER_CENTER_FLIGHT_ID')) {
            if ([string]::IsNullOrWhiteSpace(
                [Environment]::GetEnvironmentVariable($name))) {
              throw "Missing Microsoft Store automation value: $name"
            }
          }

          New-Item -ItemType Directory -Path build/reconcile -Force | Out-Null
          $flightRaw = Join-Path $env:RUNNER_TEMP 'store-flight.json'
          $productionRaw = Join-Path $env:RUNNER_TEMP 'store-production.json'
          if ($env:PARTNER_CENTER_FLIGHT_SUBMISSION_ID -notmatch '^[1-9][0-9]*$') {
            throw 'Tracked Microsoft Store Flight submission ID is invalid.'
          }
          $token = Invoke-RestMethod -Method Post `
            -Uri "https://login.microsoftonline.com/$($env:PARTNER_CENTER_TENANT_ID)/oauth2/token" `
            -ContentType 'application/x-www-form-urlencoded' `
            -Body @{
              grant_type = 'client_credentials'
              client_id = $env:PARTNER_CENTER_CLIENT_ID
              client_secret = $env:PARTNER_CENTER_CLIENT_SECRET
              resource = 'https://manage.devcenter.microsoft.com'
            }
          $headers = @{ Authorization = "Bearer $($token.access_token)" }
          $submissionUri = 'https://manage.devcenter.microsoft.com/v1.0/my/' +
            'applications/9PHHSJMWK06G/flights/' +
            "$($env:PARTNER_CENTER_FLIGHT_ID)/submissions/" +
            $env:PARTNER_CENTER_FLIGHT_SUBMISSION_ID
          $flight = Invoke-RestMethod -Method Get `
            -Uri $submissionUri -Headers $headers
          $flightStatus = Invoke-RestMethod -Method Get `
            -Uri "$submissionUri/status" -Headers $headers
          if ([string]$flight.id -cne $env:PARTNER_CENTER_FLIGHT_SUBMISSION_ID) {
            throw 'Microsoft Store Flight submission response ID changed.'
          }
          [ordered]@{
            Id = [string]$flight.id
            Status = [string]$flightStatus.status
            ApplicationPackages = @($flight.flightPackages | ForEach-Object {
                [ordered]@{
                  FileName = [string]$_.fileName
                  Version = [string]$_.version
                  # The Flight API omits architecture. The immutable candidate
                  # manifest and filename contract have already fixed it to x64.
                  Architecture = 'x64'
                  FileStatus = [string]$_.fileStatus
                }
              })
          } | ConvertTo-Json -Depth 8 | Set-Content `
            -LiteralPath $flightRaw -Encoding utf8

          $applicationUri = 'https://manage.devcenter.microsoft.com/v1.0/my/' +
            'applications/9PHHSJMWK06G'
          $application = Invoke-RestMethod -Method Get `
            -Uri $applicationUri -Headers $headers
          if ([string]$application.id -cne '9PHHSJMWK06G') {
            throw 'Microsoft Store application response ID changed.'
          }
          $productionReference = $application.pendingApplicationSubmission
          if ($null -eq $productionReference) {
            $productionReference = $application.lastPublishedApplicationSubmission
          }
          if ($null -eq $productionReference) {
            [ordered]@{
              Id = ''
              Status = 'NotSubmitted'
              Visibility = ''
              ApplicationPackages = @()
            } | ConvertTo-Json -Depth 8 | Set-Content `
              -LiteralPath $productionRaw -Encoding utf8
          } else {
            $productionId = [string]$productionReference.id
            $resourceLocation = [string]$productionReference.resourceLocation
            if ($productionId -notmatch '^[1-9][0-9]*$' -or
                $resourceLocation -cne "applications/9PHHSJMWK06G/submissions/$productionId") {
              throw 'Microsoft Store production submission reference is invalid.'
            }
            $productionUri = 'https://manage.devcenter.microsoft.com/v1.0/my/' +
              $resourceLocation
            $productionSubmission = Invoke-RestMethod -Method Get `
              -Uri $productionUri -Headers $headers
            $productionStatus = Invoke-RestMethod -Method Get `
              -Uri "$productionUri/status" -Headers $headers
            if ([string]$productionSubmission.id -cne $productionId) {
              throw 'Microsoft Store production submission response ID changed.'
            }
            [ordered]@{
              Id = [string]$productionSubmission.id
              Status = [string]$productionStatus.status
              Visibility = [string]$productionSubmission.visibility
              ApplicationPackages = @(
                $productionSubmission.applicationPackages | ForEach-Object {
                  [ordered]@{
                    FileName = [string]$_.fileName
                    Version = [string]$_.version
                    Architecture = [string]$_.architecture
                    FileStatus = [string]$_.fileStatus
                  }
                }
              )
            } | ConvertTo-Json -Depth 8 | Set-Content `
              -LiteralPath $productionRaw -Encoding utf8
          }

          $flightStatusPath = 'build/reconcile/windows-flight-status.json'
          $productionStatusPath = 'build/reconcile/windows-production-status.json'
          dart run tool/release/classify_microsoft_store_submission.dart `
            --input $flightRaw --output $flightStatusPath `
            --expected-version $env:WINDOWS_PACKAGE_VERSION `
            --expected-artifact-name $env:WINDOWS_ARTIFACT_NAME `
            --production false
          if ($LASTEXITCODE -ne 0) {
            throw 'Microsoft Store Flight status classification failed.'
          }
          dart run tool/release/classify_microsoft_store_submission.dart `
            --input $productionRaw --output $productionStatusPath `
            --expected-version $env:WINDOWS_PACKAGE_VERSION `
            --expected-artifact-name $env:WINDOWS_ARTIFACT_NAME `
            --production true
          if ($LASTEXITCODE -ne 0) {
            throw 'Microsoft Store production status classification failed.'
          }
          $flight = Get-Content -LiteralPath $flightStatusPath -Raw |
            ConvertFrom-Json
          $production = Get-Content -LiteralPath $productionStatusPath -Raw |
            ConvertFrom-Json
          @(
            "flight_ready=$($flight.Ready.ToString().ToLowerInvariant())"
            "flight_blocked=$($flight.Blocked.ToString().ToLowerInvariant())"
            "flight_summary=status=$($flight.Status)"
            "production_ready=$($production.Ready.ToString().ToLowerInvariant())"
            "production_present=$($production.Present.ToString().ToLowerInvariant())"
            "production_blocked=$($production.Blocked.ToString().ToLowerInvariant())"
            "production_summary=status=$($production.Status) present=$($production.Present.ToString().ToLowerInvariant())"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

          $verifiedAt = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          if ($flight.Ready) {
            dart run tool/release/verify_microsoft_store_submission.dart `
              --flight-id $env:PARTNER_CENTER_FLIGHT_ID --input $flightRaw `
              --output build/reconcile/windows-flight-receipt.json `
              --product-id 9PHHSJMWK06G `
              --expected-version $env:WINDOWS_PACKAGE_VERSION `
              --expected-artifact-name $env:WINDOWS_ARTIFACT_NAME `
              --release-id $env:RELEASE_ID --candidate-sha $env:CANDIDATE_SHA `
              --source-run-id $env:SOURCE_RUN_ID --verified-at $verifiedAt
            if ($LASTEXITCODE -ne 0) {
              throw 'Microsoft Store Flight receipt verification failed.'
            }
          }
          if ($production.Ready) {
            dart run tool/release/verify_microsoft_store_submission.dart `
              --input $productionRaw `
              --output build/reconcile/windows-store-production-receipt.json `
              --product-id 9PHHSJMWK06G `
              --expected-version $env:WINDOWS_PACKAGE_VERSION `
              --expected-artifact-name $env:WINDOWS_ARTIFACT_NAME `
              --release-id $env:RELEASE_ID --candidate-sha $env:CANDIDATE_SHA `
              --source-run-id $env:SOURCE_RUN_ID --verified-at $verifiedAt
            if ($LASTEXITCODE -ne 0) {
              throw 'Microsoft Store production receipt verification failed.'
            }
          }

      - name: Upload safe Store receipts
        if: steps.status.outputs.flight_ready == 'true' || steps.status.outputs.production_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-reconcile-store-${{ needs.resolve.outputs.release_id }}
          path: build/reconcile/*-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  android_validation:
    name: Resolve immutable Android validation receipt
    if: needs.resolve.outputs.found == 'true'
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      android_ready: ${{ steps.receipts.outputs.android_ready }}
      android_run_id: ${{ steps.receipts.outputs.android_run_id }}
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      ANDROID_ARTIFACT_SHA256: ${{ needs.resolve.outputs.android_artifact_sha256 }}
    steps:
      - name: Find exact Android validation receipt
        id: receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/reconcile/validations
          source_run="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,event,headBranch,conclusion)"
          jq -e '
            .workflowName == "Alpha Release" and .event == "workflow_dispatch" and
            .headBranch == "master" and .conclusion == "success"
          ' <<<"$source_run" >/dev/null
          source_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          android_name="meettrace-android-distribution-$RELEASE_ID"
          android_id="$(jq -er --arg name "$android_name" '
            [.artifacts[] | select(.expired == false and .name == $name)] |
            sort_by(.created_at, .id) | last | .id
          ' <<<"$source_artifacts")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$android_id/zip" \
            > "$RUNNER_TEMP/android-$android_id.zip"
          unzip -qp "$RUNNER_TEMP/android-$android_id.zip" receipt.json \
            > build/reconcile/validations/android.json
          jq -e --arg release "$RELEASE_ID" --arg sha "$CANDIDATE_SHA" \
            --arg digest "$ANDROID_ARTIFACT_SHA256" \
            --argjson run "$SOURCE_RUN_ID" '
            .schemaVersion == 2 and
            .validation == "androidCandidateDistribution" and
            .releaseId == $release and .candidateCommitSha == $sha and
            .sourceRunId == $run and
            (.validationRunId | type == "number" and . > 0 and . <= $run) and
            ((.validationRunId == $run and .reused == false) or
              (.validationRunId < $run and .reused == true and
               .reusedFromRunId == .validationRunId and
               (.reusedFromArtifactId | type == "number" and . > 0) and
               .reusedFromArtifactName == ("meettrace-android-distribution-" + $release) and
               (.originalReceiptSha256 | type == "string" and test("^[0-9a-f]{64}$")))) and
            .androidFirebaseArm == "passed" and
            .artifactSha256 == $digest and
            (.artifactSha256 | test("^[0-9a-f]{64}$"))
          ' build/reconcile/validations/android.json >/dev/null
          echo "android_ready=true" >> "$GITHUB_OUTPUT"
          echo "android_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          touch build/reconcile/validations/.keep

      - name: Upload resolved validation receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-reconcile-validations-${{ needs.resolve.outputs.release_id }}
          path: build/reconcile/validations/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 0

  submit_production:
    name: Submit validated MSIX to Microsoft Store production
    if: >-
      needs.resolve.outputs.found == 'true' &&
      needs.microsoft_store_status.outputs.flight_ready == 'true' &&
      needs.testflight_status.outputs.ready == 'true' &&
      needs.android_validation.outputs.android_ready == 'true' &&
      needs.microsoft_store_status.outputs.production_present != 'true' &&
      needs.microsoft_store_status.outputs.production_blocked != 'true'
    needs: [resolve, testflight_status, microsoft_store_status, android_validation]
    runs-on: windows-2025
    timeout-minutes: 30
    environment: microsoft-store
    permissions:
      actions: read
      contents: write
      issues: write
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
      WINDOWS_ARTIFACT_NAME: ${{ needs.resolve.outputs.windows_artifact_name }}
      WINDOWS_ARTIFACT_SHA256: ${{ needs.resolve.outputs.windows_artifact_sha256 }}
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
    steps:
      - name: Set up Microsoft Store CLI v0.4.1
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.1

      - name: Download and verify exact Flight-tested MSIX
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $productionDir = Join-Path $env:GITHUB_WORKSPACE 'build/reconcile/production'
          New-Item -ItemType Directory -Path $productionDir -Force | Out-Null
          $response = gh api `
            "repos/$($env:GITHUB_REPOSITORY)/actions/runs/$($env:SOURCE_RUN_ID)/artifacts?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to enumerate immutable source-run artifacts.'
          }
          $artifact = @(
            ($response | ConvertFrom-Json).artifacts |
            Where-Object {
              -not $_.expired -and
              ([string]$_.name).StartsWith('meettrace-windows-store-')
            } |
            Sort-Object created_at, id
          ) | Select-Object -Last 1
          if ($null -eq $artifact) {
            throw 'Immutable Windows Store artifact is missing.'
          }
          gh run download $env:SOURCE_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name ([string]$artifact.name) `
            --dir $productionDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to download the immutable Windows Store artifact.'
          }
          $msixPath = Join-Path $productionDir $env:WINDOWS_ARTIFACT_NAME
          if (-not (Test-Path -LiteralPath $msixPath -PathType Leaf)) {
            throw 'Flight-tested MSIX is missing.'
          }
          $actualDigest = (Get-FileHash -LiteralPath $msixPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -cne $env:WINDOWS_ARTIFACT_SHA256) {
            throw 'Flight-tested MSIX digest changed.'
          }
          "WINDOWS_MSIX_PATH=$msixPath" | Add-Content `
            -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Publish production submission at 100 percent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to configure Microsoft Store CLI credentials.'
          }
          msstore settings --enableTelemetry false
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to disable Microsoft Store CLI telemetry.'
          }
          $inputDirectory = Split-Path -Parent $env:WINDOWS_MSIX_PATH
          msstore publish $env:WINDOWS_MSIX_PATH `
            --inputDirectory $inputDirectory `
            --appId 9PHHSJMWK06G `
            --packageRolloutPercentage 100 `
            --uploadTimeout 900
          if ($LASTEXITCODE -ne 0) {
            throw 'Microsoft Store production submission failed.'
          }

      - name: Remove Microsoft Store CLI credentials
        if: always()
        shell: pwsh
        run: |
          $source = @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;

          public static class MeetTraceCredentialCleanup
          {
              [DllImport("advapi32.dll", EntryPoint = "CredDeleteW",
                  CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern bool CredDelete(string target, int type, int flags);

              public static void Delete(string target)
              {
                  if (!CredDelete(target, 1, 0))
                  {
                      int error = Marshal.GetLastWin32Error();
                      if (error != 1168)
                      {
                          throw new Win32Exception(error);
                      }
                  }
              }
          }
          '@
          Add-Type -TypeDefinition $source
          if (-not [string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_CLIENT_ID)) {
            [MeetTraceCredentialCleanup]::Delete(
              "MicrosoftStoreCli:user=$($env:PARTNER_CENTER_CLIENT_ID)"
            )
          }

      - name: Reconcile submitted production state immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --method POST \
            -f event_type=alpha-release-reconcile \
            -F "client_payload[release_id]=$RELEASE_ID" \
            -F "client_payload[source_run_id]=$SOURCE_RUN_ID" \
            -F "client_payload[candidate_sha]=$CANDIDATE_SHA"

      - name: Report production submission failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          gh label create release-blocked --repo "$GITHUB_REPOSITORY" --color B60205 --description "External release state blocks automatic publication" --force
          title="[release-blocked] $RELEASE_ID"
          # shellcheck disable=SC2016 # Markdown backticks are intentionally literal.
          body="$(printf 'Microsoft Store production 自动提交失败。Draft Release 和旧更新指针保持不变。\n\n- Candidate: `%s`\n- Reconciler run: %s' "$CANDIDATE_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title $title" --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1 || true)"
          if [[ -n "$number" ]]; then
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body" --add-label release-blocked
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label release-blocked
          fi

  report_blocked:
    name: Report rejected or unknown external state
    if: >-
      always() &&
      (needs.resolve.result == 'failure' || needs.resolve.outputs.found == 'true')
    needs: [resolve, testflight_status, microsoft_store_status, android_validation, submit_production, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Create or update release-blocked issue
        if: >-
          needs.resolve.result != 'success' ||
          needs.testflight_status.result != 'success' ||
          needs.microsoft_store_status.result != 'success' ||
          needs.android_validation.result != 'success' ||
          (needs.submit_production.result != 'success' &&
           needs.submit_production.result != 'skipped') ||
          (needs.finalize.result != 'success' &&
           needs.finalize.result != 'skipped') ||
          needs.testflight_status.outputs.blocked == 'true' ||
          needs.microsoft_store_status.outputs.flight_blocked == 'true' ||
          needs.microsoft_store_status.outputs.production_blocked == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          DISPATCH_RELEASE_ID: ${{ github.event.client_payload.release_id }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          ANDROID_VALIDATION_RESULT: ${{ needs.android_validation.result }}
          PRODUCTION_SUBMIT_RESULT: ${{ needs.submit_production.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          TESTFLIGHT_SUMMARY: ${{ needs.testflight_status.outputs.summary }}
          FLIGHT_SUMMARY: ${{ needs.microsoft_store_status.outputs.flight_summary }}
          PRODUCTION_SUMMARY: ${{ needs.microsoft_store_status.outputs.production_summary }}
        run: |
          set -euo pipefail
          gh label create release-blocked --repo "$GITHUB_REPOSITORY" --color B60205 --description "External release state blocks automatic publication" --force
          release_key="${RELEASE_ID:-$DISPATCH_RELEASE_ID}"
          if [[ ! "$release_key" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]; then
            release_key=reconciler-discovery
          fi
          title="[release-blocked] $release_key"
          body="$(printf '自动发布协调器检测到候选发现失败、拒审、未知状态、合同校验或执行失败。\n\n- Candidate resolution: %s\n- Android receipt: %s\n- Production submit: %s\n- Final gate/resume: %s\n- TestFlight: %s\n- Microsoft Store Flight: %s\n- Microsoft Store production: %s\n- Reconciler run: %s\n\nDraft Release 和现有自动更新指针均保持不变。外部状态恢复后，协调器会复用原候选继续。' "${RESOLVE_RESULT:-unknown}" "${ANDROID_VALIDATION_RESULT:-not reached}" "${PRODUCTION_SUBMIT_RESULT:-not reached}" "${FINALIZE_RESULT:-not reached}" "${TESTFLIGHT_SUMMARY:-not reached or query failed}" "${FLIGHT_SUMMARY:-not reached or query failed}" "${PRODUCTION_SUMMARY:-not reached or query failed}" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title $title" --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1 || true)"
          if [[ -n "$number" ]]; then
            gh issue reopen "$number" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body" --add-label release-blocked
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label release-blocked
          fi

      - name: Close recovered or normally pending release-blocked issue
        if: >-
          needs.resolve.result == 'success' &&
          needs.testflight_status.result == 'success' &&
          needs.microsoft_store_status.result == 'success' &&
          needs.android_validation.result == 'success' &&
          (needs.submit_production.result == 'success' ||
           needs.submit_production.result == 'skipped') &&
          (needs.finalize.result == 'success' ||
           needs.finalize.result == 'skipped') &&
          needs.testflight_status.outputs.blocked != 'true' &&
          needs.microsoft_store_status.outputs.flight_blocked != 'true' &&
          needs.microsoft_store_status.outputs.production_blocked != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "[release-blocked] $RELEASE_ID" \
            '[release-blocked] reconciler-discovery' | while read -r title; do
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | while read -r number; do
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "阻塞状态已恢复或进入正常等待，自动发布协调器将继续轮询。"
            done
          done

  finalize:
    name: Build automatic publication gate and resume Alpha Release
    if: >-
      needs.resolve.outputs.found == 'true' &&
      needs.testflight_status.outputs.ready == 'true' &&
      needs.microsoft_store_status.outputs.flight_ready == 'true' &&
      needs.microsoft_store_status.outputs.production_ready == 'true' &&
      needs.android_validation.outputs.android_ready == 'true'
    needs: [resolve, testflight_status, microsoft_store_status, android_validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
      SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
      CANDIDATE_SHA: ${{ needs.resolve.outputs.candidate_sha }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
    steps:
      - name: Collect all immutable release receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/reconcile/gate
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          extract() {
            local artifact_name="$1" file="$2" destination="$3" id
            id="$(jq -er --arg name "$artifact_name" '[.artifacts[] | select(.expired == false and .name == $name)] | last | .id' <<<"$artifacts")"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$id.zip"
            unzip -qp "$RUNNER_TEMP/$id.zip" "$file" > "$destination"
          }
          extract "meettrace-reconcile-testflight-$RELEASE_ID" testflight-production-receipt.json build/reconcile/gate/testflight.json
          extract "meettrace-reconcile-store-$RELEASE_ID" windows-flight-receipt.json build/reconcile/gate/windows-flight.json
          extract "meettrace-reconcile-store-$RELEASE_ID" windows-store-production-receipt.json build/reconcile/gate/windows-production.json
          extract "meettrace-reconcile-validations-$RELEASE_ID" android.json build/reconcile/gate/validation-android.json
          jq -n \
            --arg releaseId "$RELEASE_ID" --arg candidateCommitSha "$CANDIDATE_SHA" \
            --argjson sourceRunId "$SOURCE_RUN_ID" --argjson orchestrationRunId "$GITHUB_RUN_ID" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --slurpfile testFlight build/reconcile/gate/testflight.json \
            --slurpfile windowsFlight build/reconcile/gate/windows-flight.json \
            --slurpfile windowsProduction build/reconcile/gate/windows-production.json \
            --slurpfile androidValidation build/reconcile/gate/validation-android.json \
            '{schemaVersion: 3, releaseId: $releaseId, candidateCommitSha: $candidateCommitSha, sourceRunId: $sourceRunId, orchestrationRunId: $orchestrationRunId, buildNumber: $buildNumber, testFlight: $testFlight[0], windowsFlight: $windowsFlight[0], windowsProduction: $windowsProduction[0], validations: {android: $androidValidation[0]}}' \
            > build/reconcile/gate/release-gate.json

      - name: Upload automatic publication gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-release-gate-${{ needs.resolve.outputs.release_id }}
          path: build/reconcile/gate/release-gate.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Resume Alpha Release without final approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run alpha-release.yml --repo "$GITHUB_REPOSITORY" --ref master \
            -f "release_id=$RELEASE_ID" \
            -f "resume_run_id=$SOURCE_RUN_ID" \
            -f "orchestration_run_id=$GITHUB_RUN_ID"
