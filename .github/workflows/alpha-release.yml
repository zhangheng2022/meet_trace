name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Version identifier such as v1.0.0-alpha.1
        required: true
        type: string
      release_notes:
        description: Optional public release notes
        required: false
        type: string
      ios_testflight_external_url:
        description: Optional TestFlight external testing URL
        required: false
        type: string
      resume_run_id:
        description: Optional successful candidate run ID to finalize without rebuilding
        required: false
        type: string
      withdraw_update:
        description: Withdraw this public version from automatic update discovery without deleting assets
        required: false
        default: false
        type: boolean
      repair_update_pointer:
        description: Re-sign and repair the pointer for this existing public release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release mode and candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      candidate_sha: ${{ steps.resolve.outputs.candidate_sha }}
      build_number: ${{ steps.build_number.outputs.build_number }}
    steps:
      - name: Checkout requested master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTFLIGHT_URL: ${{ inputs.ios_testflight_external_url }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          WITHDRAW_UPDATE: ${{ inputs.withdraw_update }}
          REPAIR_UPDATE_POINTER: ${{ inputs.repair_update_pointer }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          if [[ -n "$TESTFLIGHT_URL" ]]; then
            [[ "$TESTFLIGHT_URL" =~ ^https://testflight\.apple\.com/join/[A-Za-z0-9]+/?$ ]]
          fi
          if [[ -n "$RESUME_RUN_ID" ]]; then
            [[ "$RESUME_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          fi
          visibility="$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)"
          [[ "$visibility" == "PUBLIC" ]]

          git fetch --no-tags origin master
          tag_exists=false
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_ID" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
            tag_exists=true
            [[ "$(git cat-file -t "refs/tags/$RELEASE_ID")" == "tag" ]]
            candidate_sha="$(git rev-parse "refs/tags/$RELEASE_ID^{}")"
          else
            candidate_sha="$(git rev-parse HEAD)"
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$candidate_sha" origin/master

          marketing_version="$(git show "$candidate_sha:pubspec.yaml" | sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p')"
          [[ -n "$marketing_version" ]]
          [[ "$RELEASE_ID" == "v${marketing_version}-alpha."* ]]

          if release_json="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName 2>/dev/null)"; then
            [[ "$tag_exists" == true ]]
            [[ "$(jq -r .tagName <<<"$release_json")" == "$RELEASE_ID" ]]
            if [[ "$(jq -r .isDraft <<<"$release_json")" == true ]]; then
              [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]]
              if [[ -n "$RESUME_RUN_ID" ]]; then
                mode=resume
              else
                mode=candidate
              fi
            else
              [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]]
              if [[ -n "$RESUME_RUN_ID" ]]; then
                echo "A resume run can only finalize an existing Draft Release" >&2
                exit 1
              fi
              mode=metadata
              if [[ -z "$TESTFLIGHT_URL" && -z "$RELEASE_NOTES" && "$WITHDRAW_UPDATE" != true && "$REPAIR_UPDATE_POINTER" != true ]]; then
                echo "A public release rerun must repair metadata or withdraw automatic discovery" >&2
                exit 1
              fi
            fi
          else
            if [[ -n "$RESUME_RUN_ID" ]]; then
              echo "A resume run requires an existing Draft Release" >&2
              exit 1
            fi
            mode=candidate
          fi

          if [[ "$WITHDRAW_UPDATE" == true && "$mode" != metadata ]]; then
            echo "Only an existing public release can be withdrawn" >&2
            exit 1
          fi
          if [[ "$REPAIR_UPDATE_POINTER" == true && "$mode" != metadata ]]; then
            echo "Only an existing public release can repair its update pointer" >&2
            exit 1
          fi
          if [[ "$WITHDRAW_UPDATE" == true && "$REPAIR_UPDATE_POINTER" == true ]]; then
            echo "Withdrawal and pointer repair are mutually exclusive" >&2
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Allocate shared release build number
        id: build_number
        if: steps.resolve.outputs.mode == 'candidate' || steps.resolve.outputs.mode == 'resume'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA: ${{ steps.resolve.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          release_assets="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | [
                .tag_name,
                (([.assets[] | select(.name == "android-candidate-manifest.json")][0].url //
                  [.assets[] | select(.name == "candidate-manifest.json")][0].url //
                  ""))
              ] | @tsv'
          )"
          current_asset_url="$(
            awk -F '\t' -v tag="$RELEASE_ID" \
              '$1 == tag && $2 != "" { print $2; exit }' <<<"$release_assets"
          )"

          if [[ -n "$current_asset_url" ]]; then
            current_manifest="$(
              gh api -H "Accept: application/octet-stream" "$current_asset_url"
            )"
            jq -e \
              --arg release_id "$RELEASE_ID" \
              --arg candidate_sha "$CANDIDATE_SHA" \
              '.platform == "android" and
               .releaseId == $release_id and
               .commitSha == $candidate_sha' \
              <<<"$current_manifest" >/dev/null
            build_number="$(jq -er '
              .buildNumber | tostring | select(test("^[1-9][0-9]*$"))
            ' <<<"$current_manifest")"
            echo "Reusing build number $build_number from $RELEASE_ID"
          else
            max_build_number=0
            while IFS=$'\t' read -r tag asset_url; do
              [[ -n "$tag" && -n "$asset_url" && "$tag" != "$RELEASE_ID" ]] || continue
              manifest="$(
                gh api -H "Accept: application/octet-stream" "$asset_url"
              )"
              candidate="$(jq -er '
                select(.platform == "android") |
                .buildNumber | tostring | select(test("^[1-9][0-9]*$"))
              ' <<<"$manifest")"
              if (( candidate > max_build_number )); then
                max_build_number="$candidate"
              fi
            done <<<"$release_assets"

            if (( max_build_number > 0 )); then
              build_number=$((max_build_number + 1))
            else
              build_number="$(
                git show "$CANDIDATE_SHA:pubspec.yaml" |
                  sed -nE 's/^version:[[:space:]]*[^+[:space:]]+\+([1-9][0-9]*).*/\1/p'
              )"
              [[ -n "$build_number" ]]
            fi
            echo "Allocated next build number: $build_number"
          fi

          (( build_number > 0 && build_number <= 2100000000 ))
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  quality:
    name: Automatic technical checks
    if: needs.prepare.outputs.mode == 'candidate'
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/_flutter-core.yml
    with:
      checkout_ref: ${{ needs.prepare.outputs.candidate_sha }}
      build_android: false
      upload_evidence: false

  android:
    if: needs.prepare.outputs.mode == 'candidate'
    needs: [prepare, quality]
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: Build, sign, and stage Android Alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: android-alpha

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Validate candidate identity
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" == "$CANDIDATE_SHA" ]]
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$candidate_sha" origin/master

          marketing_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          [[ -n "$marketing_version" ]]
          expected_prefix="v${marketing_version}-alpha."
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_ID" == "$expected_prefix"* ]]

          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

      - name: Prepare release build number
        shell: bash
        env:
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "ANDROID_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SENTRY_RELEASE=com.meettrace.app@$MARKETING_VERSION+$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SENTRY_DIST=$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Android versionCode: $RELEASE_BUILD_NUMBER"

      - name: Reuse immutable staged Android candidate
        id: staged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/android/alpha

          if ! release_json="$(
            gh release view "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets 2>/dev/null
          )"; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$(jq -r .isDraft <<<"$release_json")" == true ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]]

          apk_name="meettrace-${RELEASE_ID}-android-arm64.apk"
          required_assets=("$apk_name" candidate-manifest.json)
          for asset_name in "${required_assets[@]}"; do
            jq -e --arg name "$asset_name" \
              '.assets | any(.name == $name)' <<<"$release_json" >/dev/null || {
                echo "Existing draft candidate is incomplete: missing $asset_name" >&2
                exit 1
              }
          done

          asset_url="$(
            jq -er \
              '.assets[] | select(.name == "candidate-manifest.json") | .apiUrl' \
              <<<"$release_json"
          )"
          gh api -H "Accept: application/octet-stream" "$asset_url" \
            > build/android/alpha/candidate-manifest.json

          manifest=build/android/alpha/candidate-manifest.json
          jq -e \
            --arg release_id "$RELEASE_ID" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg build_number "$ANDROID_BUILD_NUMBER" \
            --arg apk_name "$apk_name" \
            '.platform == "android" and
             .releaseId == $release_id and
             .commitSha == $candidate_sha and
             (.buildNumber | tostring) == $build_number and
             .artifact.name == $apk_name and
             (.artifact.sha256 | test("^[0-9a-f]{64}$"))' \
            "$manifest" >/dev/null

          manifest_digest="sha256:$(jq -er .artifact.sha256 "$manifest")"
          staged_digest="$(
            jq -er --arg name "$apk_name" \
              '.assets[] | select(.name == $name) | .digest' <<<"$release_json"
          )"
          [[ "$staged_digest" == "$manifest_digest" ]] || {
            echo "Staged Android APK digest does not match its candidate manifest" >&2
            exit 1
          }

          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "Reusing immutable staged Android candidate $RELEASE_ID"

      - name: Set up Java 17
        if: steps.staged.outputs.reuse != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        if: steps.staged.outputs.reuse != 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Resolve locked dependencies
        if: steps.staged.outputs.reuse != 'true'
        run: flutter pub get --enforce-lockfile

      - name: Decode Android signing keystore
        if: steps.staged.outputs.reuse != 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "${ANDROID_KEYSTORE_BASE64//[[:space:]]/}" ]]
          keystore_path="$RUNNER_TEMP/meettrace-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          [[ -s "$keystore_path" ]]
          chmod 600 "$keystore_path"
          echo "MEETTRACE_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed Android Release APK
        if: steps.staged.outputs.reuse != 'true'
        shell: bash
        env:
          MEETTRACE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEETTRACE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEETTRACE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name="$MARKETING_VERSION" \
            --build-number="$ANDROID_BUILD_NUMBER" \
            --dart-define=MEETTRACE_APP_UPDATE_ENABLED=true \
            --dart-define="MEETTRACE_VERSION_NAME=$MARKETING_VERSION" \
            --dart-define="MEETTRACE_BUILD_NUMBER=$ANDROID_BUILD_NUMBER" \
            --dart-define="SENTRY_RELEASE=$SENTRY_RELEASE" \
            --dart-define="SENTRY_DIST=$SENTRY_DIST"
          source_apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          apk_path="build/android/alpha/meettrace-${RELEASE_ID}-android-arm64.apk"
          [[ -s "$source_apk" ]]
          mkdir -p "$(dirname "$apk_path")"
          mv -- "$source_apk" "$apk_path"
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"

      - name: Upload Android debug symbols to Sentry
        if: steps.staged.outputs.reuse != 'true'
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: info
        run: |
          set -euo pipefail
          [[ -n "${SENTRY_AUTH_TOKEN//[[:space:]]/}" ]]
          for attempt in 1 2 3; do
            if dart run sentry_dart_plugin \
              --sentry-define="symbols_path=build" \
              --sentry-define="release=$SENTRY_RELEASE" \
              --sentry-define="dist=$SENTRY_DIST"; then
              exit 0
            fi
            sleep "$((attempt * 10))"
          done
          echo "Sentry Android debug symbol upload failed after 3 attempts." >&2
          exit 1

      - name: Inspect APK contents
        if: steps.staged.outputs.reuse != 'true'
        shell: pwsh
        run: |
          ./tool/benchmarks/inspect_debug_apk.ps1 `
            -ApkPath $env:APK_PATH `
            -ReportPath build/android/alpha/android-apk-inspection.json
          $report = Get-Content -LiteralPath build/android/alpha/android-apk-inspection.json -Raw |
            ConvertFrom-Json
          $abis = @($report.abis)
          if ($abis.Count -ne 1 -or $abis[0] -ne 'arm64-v8a') {
            throw "Public Alpha APK must contain only arm64-v8a; found: $($abis -join ', ')"
          }

      - name: Verify APK signature and certificate
        if: steps.staged.outputs.reuse != 'true'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p build/android/alpha
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          [[ -x "$apksigner" ]]
          "$apksigner" verify --verbose --print-certs "$APK_PATH" \
            | tee build/android/alpha/apksigner.txt
          actual="$(sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+)[[:space:]]*$/\1/p' build/android/alpha/apksigner.txt | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$actual" && -n "$expected" && "$actual" == "$expected" ]]
          printf '%s\n' "$actual" > build/android/alpha/signing-certificate.sha256
          sha256sum "$APK_PATH" | tee build/android/alpha/android-release-apk.sha256

      - name: Write Android candidate manifest
        if: steps.staged.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$RELEASE_ID" \
          MARKETING_VERSION="$MARKETING_VERSION" \
          ANDROID_BUILD_NUMBER="$ANDROID_BUILD_NUMBER" \
          APK_PATH="$APK_PATH" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path(os.environ["APK_PATH"])
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          signing_identity = Path(
              "build/android/alpha/signing-certificate.sha256"
          ).read_text().strip().replace(":", "").lower()
          if len(signing_identity) != 64:
              raise SystemExit("Android signing identity digest is invalid")
          manifest = {
              "schemaVersion": 1,
              "platform": "android",
              "releaseId": os.environ["RELEASE_ID"],
              "marketingVersion": os.environ["MARKETING_VERSION"],
              "buildNumber": os.environ["ANDROID_BUILD_NUMBER"],
              "commitSha": os.environ["CANDIDATE_SHA"],
              "workflowFile": ".github/workflows/alpha-release.yml",
              "job": "android",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "packageIdentity": "com.meettrace.app",
              "signingIdentitySha256": signing_identity,
              "artifact": {"name": apk.name, "bytes": apk.stat().st_size, "sha256": digest},
              "distribution": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "visibility": "public-after-finalize",
                  "releaseState": "draft",
                  "publiclyInstallable": False,
              },
          }
          Path("build/android/alpha/candidate-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate APK provenance attestation
        if: steps.staged.outputs.reuse != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.APK_PATH }}

      - name: Stage APK in this repository's draft release
        if: steps.staged.outputs.reuse != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          visibility="$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)"
          [[ "$visibility" == "PUBLIC" ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_ID" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
            [[ "$(git cat-file -t "refs/tags/$RELEASE_ID")" == "tag" ]]
            [[ "$(git rev-parse "refs/tags/$RELEASE_ID^{}")" == "$CANDIDATE_SHA" ]]
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_ID" "$CANDIDATE_SHA" -m "MeetTrace $RELEASE_ID candidate"
            git push origin "refs/tags/$RELEASE_ID"
          fi

          notes_path="$RUNNER_TEMP/android-release-notes.md"
          {
            echo "MeetTrace Android candidate \`$RELEASE_ID\` (not publicly installable yet)."
            echo
            echo "Source: \`$GITHUB_REPOSITORY@$CANDIDATE_SHA\`"
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "This Draft Release must remain unpublished until the matching iOS TestFlight candidate passes final verification."
            if [[ -n "$RELEASE_NOTES" ]]; then
              echo
              printf '%s\n' "$RELEASE_NOTES"
            fi
          } > "$notes_path"

          if gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite assets in existing release $RELEASE_ID" >&2
            exit 1
          fi
          gh release create "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft --prerelease \
            --title "MeetTrace $RELEASE_ID Android candidate" \
            --notes-file "$notes_path"

          gh release upload "$RELEASE_ID" \
            "$APK_PATH" \
            build/android/alpha/candidate-manifest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload non-sensitive Android candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-android-alpha-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/android/alpha/*.json
            build/android/alpha/*.sha256
            build/android/alpha/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MEETTRACE_ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$MEETTRACE_ANDROID_KEYSTORE_PATH"
          fi

  ios:
    if: needs.prepare.outputs.mode == 'candidate'
    needs: [prepare, android]
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Build, sign, and upload iOS app
    runs-on: macos-26
    timeout-minutes: 120
    environment: testflight
    env:
      IOS_BUNDLE_ID: com.meettrace.app
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"

    steps:
      - name: Validate release identifier
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Validate candidate identity
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          marketing_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          [[ -n "$marketing_version" ]]
          expected_prefix="v${marketing_version}-alpha."
          [[ "$RELEASE_ID" == "$expected_prefix"* ]]

          git fetch --force origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_ID")"
          candidate_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_ID")"
          [[ "$tag_type" == "tag" ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" == "$EXPECTED_CANDIDATE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$candidate_sha" ]]
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$candidate_sha" origin/master

          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "CANDIDATE_REF=refs/tags/$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Capture toolchain snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios/testflight
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_arch=$(uname -m)"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_name=${RUNNER_NAME}"
            echo "--- macOS ---"
            sw_vers
            echo "--- Xcode ---"
            xcode-select -p
            xcodebuild -version
            echo "--- Flutter ---"
            flutter --version
            echo "--- Dart ---"
            dart --version 2>&1
            echo "--- CocoaPods ---"
            pod --version
            echo "--- Ruby ---"
            ruby --version
            echo "--- Fastlane ---"
            bundle exec fastlane --version
            echo "--- Disk ---"
            df -h
          } | tee build/ios/testflight/toolchain.txt

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare release build number
        shell: bash
        env:
          RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          echo "IOS_BUILD_NUMBER=$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SENTRY_RELEASE=$IOS_BUNDLE_ID@$MARKETING_VERSION+$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "SENTRY_DIST=$RELEASE_BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "TestFlight build number: $RELEASE_BUILD_NUMBER"

      - name: Build and inspect unsigned Release app
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios \
            --release --no-codesign \
            --build-name="$MARKETING_VERSION" \
            --build-number="$IOS_BUILD_NUMBER" \
            --dart-define=MEETTRACE_APP_UPDATE_ENABLED=true \
            --dart-define="MEETTRACE_VERSION_NAME=$MARKETING_VERSION" \
            --dart-define="MEETTRACE_BUILD_NUMBER=$IOS_BUILD_NUMBER" \
            --dart-define="SENTRY_RELEASE=$SENTRY_RELEASE" \
            --dart-define="SENTRY_DIST=$SENTRY_DIST"
          bash tool/benchmarks/inspect_ios_app.sh \
            build/ios/iphoneos/Runner.app \
            build/ios/testflight/ios-app-inspection.json

      - name: Validate and decode signing materials
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import os
          import re
          from pathlib import Path

          required = (
              "IOS_DISTRIBUTION_P12_PASSWORD",
              "APPLE_TEAM_ID",
              "APP_STORE_CONNECT_KEY_ID",
              "APP_STORE_CONNECT_ISSUER_ID",
          )
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              raise SystemExit("Missing required GitHub Secrets: " + ", ".join(missing))

          team_id = os.environ["APPLE_TEAM_ID"].strip()
          key_id = os.environ["APP_STORE_CONNECT_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_CONNECT_ISSUER_ID"].strip()
          if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
              raise SystemExit("APPLE_TEAM_ID must be a 10-character uppercase identifier")
          if not re.fullmatch(r"[A-Za-z0-9_-]{4,64}", key_id):
              raise SystemExit("APP_STORE_CONNECT_KEY_ID has an invalid format")
          if not re.fullmatch(
              r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
              issuer_id,
          ):
              raise SystemExit("APP_STORE_CONNECT_ISSUER_ID must be a UUID")

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          destinations = {
              "IOS_DISTRIBUTION_P12_BASE64": runner_temp / "meettrace-distribution.p12",
              "IOS_PROVISIONING_PROFILE_BASE64": runner_temp / "meettrace-app-store.mobileprovision",
              "APP_STORE_CONNECT_API_KEY_P8_BASE64": runner_temp / "meettrace-api-key.p8",
          }
          for secret_name, destination in destinations.items():
              encoded = "".join(os.environ.get(secret_name, "").split())
              if not encoded:
                  raise SystemExit(f"Missing required GitHub Secret: {secret_name}")
              try:
                  decoded = base64.b64decode(encoded, validate=True)
              except (binascii.Error, ValueError) as error:
                  raise SystemExit(f"{secret_name} is not valid Base64: {error}") from error
              if not decoded:
                  raise SystemExit(f"{secret_name} decoded to an empty file")
              destination.write_bytes(decoded)
              destination.chmod(0o600)

          p8_path = destinations["APP_STORE_CONNECT_API_KEY_P8_BASE64"]
          if b"BEGIN PRIVATE KEY" not in p8_path.read_bytes():
              raise SystemExit("App Store Connect API key is not a valid .p8 private key")

          env_values = {
              "CERTIFICATE_PATH": destinations["IOS_DISTRIBUTION_P12_BASE64"],
              "PROVISIONING_PROFILE_PATH": destinations["IOS_PROVISIONING_PROFILE_BASE64"],
              "APP_STORE_CONNECT_API_KEY_PATH": p8_path,
              "APPLE_TEAM_ID": team_id,
              "APP_STORE_CONNECT_KEY_ID": key_id,
              "APP_STORE_CONNECT_ISSUER_ID": issuer_id,
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for name, value in env_values.items():
                  stream.write(f"{name}={value}\n")
          print("Signing and App Store Connect materials decoded into RUNNER_TEMP")
          PY

      - name: Import distribution certificate
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/meettrace-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          original_default_keychain="$(security default-keychain -d user | tr -d '"')"

          {
            echo "KEYCHAIN_PATH=$keychain_path"
            echo "ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain"
          } >> "$GITHUB_ENV"

          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$original_default_keychain"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identity_output"
          identity_sha="$(
            printf '%s\n' "$identity_output" |
              awk -v team="$APPLE_TEAM_ID" \
                '$0 ~ team && ($0 ~ /Apple Distribution/ || $0 ~ /iPhone Distribution/) {print $2; exit}'
          )"
          if [[ -z "$identity_sha" ]]; then
            echo "No valid Apple Distribution identity for APPLE_TEAM_ID was found in the p12" >&2
            exit 1
          fi

          echo "IOS_DISTRIBUTION_IDENTITY=$identity_sha" >> "$GITHUB_ENV"

      - name: Validate and install provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          profile_plist="$RUNNER_TEMP/meettrace-profile.plist"
          security cms -D -i "$PROVISIONING_PROFILE_PATH" > "$profile_plist"

          PROFILE_PLIST="$profile_plist" python3 - <<'PY'
          import os
          import plistlib
          import hashlib
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          with Path(os.environ["PROFILE_PLIST"]).open("rb") as stream:
              profile = plistlib.load(stream)
          entitlements = profile.get("Entitlements", {})
          expected_bundle_id = os.environ["IOS_BUNDLE_ID"]
          expected_team_id = os.environ["APPLE_TEAM_ID"]
          application_identifier = str(entitlements.get("application-identifier", ""))
          profile_bundle_id = application_identifier.split(".", 1)[1] if "." in application_identifier else ""
          profile_team_id = str(
              entitlements.get("com.apple.developer.team-identifier")
              or (profile.get("TeamIdentifier") or [""])[0]
          )
          profile_certificate_hashes = {
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in profile.get("DeveloperCertificates", [])
              if isinstance(certificate, bytes)
          }
          expected_identity = os.environ["IOS_DISTRIBUTION_IDENTITY"].strip().upper()

          errors = []
          if profile_bundle_id != expected_bundle_id:
              errors.append(f"profile bundle ID is {profile_bundle_id!r}, expected {expected_bundle_id!r}")
          if profile_team_id != expected_team_id:
              errors.append(f"profile team ID is {profile_team_id!r}, expected {expected_team_id!r}")
          if expected_identity not in profile_certificate_hashes:
              errors.append(
                  "profile does not include the distribution certificate imported from the p12"
              )
          if entitlements.get("get-task-allow") is not False:
              errors.append("profile permits debugging and is not an App Store distribution profile")
          if profile.get("ProvisionedDevices"):
              errors.append("profile contains registered devices and is not an App Store profile")
          if profile.get("ProvisionsAllDevices"):
              errors.append("enterprise provisioning profiles cannot be uploaded to TestFlight")

          expiration = profile.get("ExpirationDate")
          if not isinstance(expiration, datetime):
              errors.append("profile has no valid expiration date")
          else:
              if expiration.tzinfo is None:
                  expiration = expiration.replace(tzinfo=timezone.utc)
              if expiration <= datetime.now(timezone.utc):
                  errors.append("profile has expired")
          uuid = str(profile.get("UUID", "")).strip()
          if not re.fullmatch(
              r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
              uuid,
          ):
              errors.append("profile has no valid UUID")
          if errors:
              raise SystemExit("Invalid provisioning profile: " + "; ".join(errors))

          install_dir = Path.home() / "Library/MobileDevice/Provisioning Profiles"
          install_dir.mkdir(parents=True, exist_ok=True)
          install_path = install_dir / f"{uuid}.mobileprovision"
          install_path.write_bytes(Path(os.environ["PROVISIONING_PROFILE_PATH"]).read_bytes())
          install_path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"IOS_PROVISIONING_PROFILE_UUID={uuid}\n")
              stream.write(f"IOS_PROVISIONING_PROFILE_INSTALL_PATH={install_path}\n")
          print(f"Provisioning profile validated: {profile.get('Name', uuid)}")
          PY

      - name: Configure Runner target signing
        shell: bash
        run: |
          set -euo pipefail
          bundle exec ruby -rxcodeproj <<'RUBY'
          project_path = "ios/Runner.xcodeproj"
          project = Xcodeproj::Project.open(project_path)
          runner = project.targets.find { |target| target.name == "Runner" }
          abort("Runner target was not found in #{project_path}") unless runner

          release = runner.build_configurations.find { |configuration| configuration.name == "Release" }
          abort("Runner Release configuration was not found") unless release

          release.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("APPLE_TEAM_ID")
          release.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV.fetch("IOS_BUNDLE_ID")
          release.build_settings["CODE_SIGN_STYLE"] = "Manual"
          release.build_settings["CODE_SIGN_IDENTITY"] = ENV.fetch("IOS_DISTRIBUTION_IDENTITY")
          release.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch(
            "IOS_PROVISIONING_PROFILE_UUID",
          )
          project.save

          forbidden_keys = %w[
            DEVELOPMENT_TEAM
            CODE_SIGN_IDENTITY
            PROVISIONING_PROFILE
            PROVISIONING_PROFILE_SPECIFIER
          ]
          other_targets = project.targets.reject { |target| target.name == "Runner" }
          violations = other_targets.flat_map do |target|
            target.build_configurations.flat_map do |configuration|
              forbidden_keys.filter_map do |key|
                value = configuration.build_settings[key]
                "#{target.name}/#{configuration.name}: #{key}=#{value}" if value && !value.to_s.empty?
              end
            end
          end
          abort("Signing settings leaked to non-Runner targets: #{violations.join(', ')}") unless violations.empty?

          puts "Manual App Store signing configured for Runner/Release only"
          RUBY

      - name: Archive and export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/MeetTrace.xcarchive"
          export_path="$RUNNER_TEMP/meettrace-export"
          export_options="$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild_help="$(xcodebuild -help 2>&1)"
          if grep -q "app-store-connect" <<< "$xcodebuild_help"; then
            export_method="app-store-connect"
          else
            export_method="app-store"
          fi
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>method</key><string>${export_method}</string>
            <key>provisioningProfiles</key>
            <dict><key>${IOS_BUNDLE_ID}</key><string>${IOS_PROVISIONING_PROFILE_UUID}</string></dict>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$export_options"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$archive_path" \
            archive \
            FLUTTER_BUILD_NUMBER="$IOS_BUILD_NUMBER" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            COMPILER_INDEX_STORE_ENABLE=NO

          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa_count="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          if [[ "$ipa_count" != "1" ]]; then
            echo "Expected exactly one exported IPA, found $ipa_count" >&2
            find "$export_path" -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi
          exported_ipa="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          output_ipa="$GITHUB_WORKSPACE/build/ios/testflight/meettrace-testflight-${IOS_BUILD_NUMBER}.ipa"
          cp "$exported_ipa" "$output_ipa"
          echo "IPA_PATH=$output_ipa" >> "$GITHUB_ENV"

      - name: Verify signed IPA
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/meettrace-ipa-verify"
          mkdir -p "$verify_dir"
          ditto -x -k "$IPA_PATH" "$verify_dir"
          app_count="$(find "$verify_dir/Payload" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          if [[ "$app_count" != "1" ]]; then
            echo "Expected exactly one app bundle in IPA, found $app_count" >&2
            exit 1
          fi
          app_path="$(find "$verify_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dvv "$app_path" 2>&1 | tee build/ios/testflight/codesign.txt
          test -f "$app_path/embedded.mobileprovision"
          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          actual_build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          [[ "$actual_bundle_id" == "$IOS_BUNDLE_ID" ]]
          [[ "$actual_build_number" == "$IOS_BUILD_NUMBER" ]]
          grep -Fq "TeamIdentifier=$APPLE_TEAM_ID" build/ios/testflight/codesign.txt

          /usr/bin/unzip -tq "$IPA_PATH"
          /usr/bin/unzip -Z1 "$IPA_PATH" > build/ios/testflight/ipa-entries.txt
          if grep -Eqi '\.(p12|p8|pem|key)$' build/ios/testflight/ipa-entries.txt; then
            echo "IPA contains forbidden signing material" >&2
            exit 1
          fi
          profile_count="$(grep -Ec '/embedded\.mobileprovision$' build/ios/testflight/ipa-entries.txt || true)"
          [[ "$profile_count" == "1" ]]
          shasum -a 256 "$IPA_PATH" | tee "$IPA_PATH.sha256"

          IPA_PATH="$IPA_PATH" python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          def output(*command: str) -> str:
              return subprocess.check_output(command, text=True, stderr=subprocess.STDOUT).strip()

          ipa_path = Path(os.environ["IPA_PATH"])
          digest = hashlib.sha256()
          with ipa_path.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          metadata = {
              "schemaVersion": 1,
              "platform": "ios",
              "releaseId": os.environ["RELEASE_ID"],
              "marketingVersion": os.environ["MARKETING_VERSION"],
              "capturedAtUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commitSha": os.environ["CANDIDATE_SHA"],
              "ref": os.environ["CANDIDATE_REF"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "buildNumber": os.environ["IOS_BUILD_NUMBER"],
              "bundleId": os.environ["IOS_BUNDLE_ID"],
              "workflowFile": ".github/workflows/alpha-release.yml",
              "job": "ios",
              "runner": {
                  "os": os.environ["RUNNER_OS"],
                  "architecture": output("uname", "-m"),
                  "macos": output("sw_vers", "-productVersion"),
              },
              "xcode": output("xcodebuild", "-version"),
              "flutter": json.loads(output("flutter", "--version", "--machine")),
              "fastlane": output(
                  "bundle", "exec", "fastlane", "--version"
              ).splitlines()[-1],
              "artifact": {
                  "name": ipa_path.name,
                  "bytes": ipa_path.stat().st_size,
                  "sha256": digest.hexdigest(),
                  "distributionSigned": True,
                  "testFlightUploadCandidate": True,
              },
          }
          report_path = ipa_path.parent / "candidate-manifest.json"
          report_path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Candidate manifest: {report_path}")
          PY

      - name: Upload iOS debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_LOG_LEVEL: info
        run: |
          set -euo pipefail
          [[ -n "${SENTRY_AUTH_TOKEN//[[:space:]]/}" ]]
          symbols_path="$RUNNER_TEMP/MeetTrace.xcarchive/dSYMs"
          [[ -d "$symbols_path" ]]
          for attempt in 1 2 3; do
            if dart run sentry_dart_plugin \
              --sentry-define="symbols_path=$symbols_path" \
              --sentry-define="release=$SENTRY_RELEASE" \
              --sentry-define="dist=$SENTRY_DIST"; then
              exit 0
            fi
            sleep "$((attempt * 10))"
          done
          echo "Sentry iOS debug symbol upload failed after 3 attempts." >&2
          exit 1

      - name: Generate IPA provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.IPA_PATH }}

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          TESTFLIGHT_CHANGELOG: ${{ inputs.release_notes }}
        run: bundle exec fastlane ios upload_testflight

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## TestFlight upload submitted"
            echo
            echo "- Bundle ID: \`$IOS_BUNDLE_ID\`"
            echo "- Build number: \`$IOS_BUILD_NUMBER\`"
            echo "- IPA: \`$(basename "$IPA_PATH")\`"
            echo "- Processing and tester availability remain subject to App Store Connect validation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-ios-testflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ios/testflight/*.sha256
            build/ios/testflight/*.json
            build/ios/testflight/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" && -e "$ORIGINAL_DEFAULT_KEYCHAIN" ]]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN"
          fi
          cleanup_keychain="${KEYCHAIN_PATH:-$RUNNER_TEMP/meettrace-signing.keychain-db}"
          if [[ -e "$cleanup_keychain" ]]; then
            security delete-keychain "$cleanup_keychain"
          fi
          rm -f \
            "${CERTIFICATE_PATH:-$RUNNER_TEMP/meettrace-distribution.p12}" \
            "${PROVISIONING_PROFILE_PATH:-$RUNNER_TEMP/meettrace-app-store.mobileprovision}" \
            "${APP_STORE_CONNECT_API_KEY_PATH:-$RUNNER_TEMP/meettrace-api-key.p8}" \
            "${IOS_PROVISIONING_PROFILE_INSTALL_PATH:-$RUNNER_TEMP/profile-not-installed}" \
            "$RUNNER_TEMP/meettrace-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"

  windows:
    if: needs.prepare.outputs.mode == 'candidate'
    needs: [prepare, quality]
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Build Microsoft Store Windows candidate
    runs-on: windows-2025
    timeout-minutes: 90
    environment: windows-alpha
    env:
      RELEASE_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Validate candidate and Store identity
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:CANDIDATE_SHA) {
            throw 'Windows candidate commit does not match prepare output.'
          }
          if ($env:RELEASE_ID -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$') {
            throw 'Windows release ID is invalid.'
          }
          if ($env:RELEASE_BUILD_NUMBER -notmatch '^[1-9][0-9]*$') {
            throw 'Windows release build number is invalid.'
          }
          if ([uint64]$env:RELEASE_BUILD_NUMBER -gt 65535) {
            throw 'Windows Store package build number exceeds 65535.'
          }
          $identity = Get-Content `
            -LiteralPath windows/packaging/msix/store_identity.json `
            -Raw | ConvertFrom-Json
          if ($identity.identityName -cne 'zhangheng2026.MeetTrace' -or
              $identity.publisher -cne 'CN=E5BC0A60-65F7-46C4-9A30-653FFCF9619B' -or
              $identity.publisherDisplayName -cne 'zhangheng2026' -or
              $identity.packageFamilyName -cne 'zhangheng2026.MeetTrace_vaaj3dqegb9y0' -or
              $identity.storeId -cne '9PHHSJMWK06G' -or
              $identity.storeUri -cne 'ms-windows-store://pdp/?productid=9PHHSJMWK06G' -or
              $identity.storeUrl -cne 'https://apps.microsoft.com/detail/9PHHSJMWK06G') {
            throw 'Microsoft Store identity does not match Partner Center.'
          }
          $marketingVersion = (Get-Content -LiteralPath pubspec.yaml |
            Select-String -Pattern '^version:\s*([^+\s]+)\+' |
            Select-Object -First 1).Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($marketingVersion) -or
              $env:RELEASE_ID -notlike "v$marketingVersion-alpha.*") {
            throw 'Windows marketing version does not match the release ID.'
          }
          "MARKETING_VERSION=$marketingVersion" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MEETTRACE_MSIX_VERSION=1.0.$($env:RELEASE_BUILD_NUMBER).0" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_MSIX_PATH=build/windows/msix/meettrace-$($env:RELEASE_ID)-windows-store-x64.msix" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Java 17 for JNI headers
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Capture Windows toolchain snapshot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/windows/msix | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $installedRoots = Get-ItemProperty `
            'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' `
            -ErrorAction Stop
          $sdkRoot = $installedRoots.KitsRoot10
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            throw 'Windows SDK KitsRoot10 is missing from Installed Roots.'
          }
          $makeAppx = Get-ChildItem -LiteralPath (Join-Path $sdkRoot 'bin') `
            -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $makeAppx) {
            throw 'Windows SDK does not provide x64 MakeAppx.exe.'
          }
          @(
            "captured_at_utc=$([DateTimeOffset]::UtcNow.ToString('O'))"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "windows_caption=$($os.Caption)"
            "windows_version=$($os.Version)"
            "cpu=$($cpu.Name)"
            "logical_processors=$($cpu.NumberOfLogicalProcessors)"
            "memory_bytes=$($os.TotalVisibleMemorySize * 1KB)"
            "java_home=$env:JAVA_HOME"
            "makeappx=$($makeAppx.FullName)"
            '--- Flutter ---'
            (flutter --version)
            '--- Dart ---'
            (dart --version 2>&1)
          ) | Set-Content -LiteralPath build/windows/msix/toolchain.txt -Encoding utf8

      - name: Build Windows x64 Store Release
        shell: pwsh
        run: |
          flutter build windows --release `
            --build-name $env:MARKETING_VERSION `
            --build-number $env:RELEASE_BUILD_NUMBER `
            --dart-define=MEETTRACE_APP_UPDATE_ENABLED=true `
            --dart-define=MEETTRACE_VERSION_NAME=$env:MARKETING_VERSION `
            --dart-define=MEETTRACE_BUILD_NUMBER=$env:RELEASE_BUILD_NUMBER `
            --dart-define=SENTRY_ENABLED=false

      - name: Create Microsoft Store MSIX candidate
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File tool/windows/package_msix.ps1 `
            -MicrosoftStore `
            -PackageVersion $env:MEETTRACE_MSIX_VERSION `
            -OutputPath $env:WINDOWS_MSIX_PATH

      - name: Inspect Store MSIX identity and content
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File tool/benchmarks/inspect_msix.ps1 `
            -MsixPath $env:WINDOWS_MSIX_PATH `
            -ExpectedIdentityName 'zhangheng2026.MeetTrace' `
            -ExpectedPublisher 'CN=E5BC0A60-65F7-46C4-9A30-653FFCF9619B' `
            -ExpectedPublisherDisplayName 'zhangheng2026' `
            -ExpectedVersion $env:MEETTRACE_MSIX_VERSION `
            -ReportPath build/windows/msix/msix-inspection.json

      - name: Write Windows candidate manifest
        shell: pwsh
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = Get-Content `
            -LiteralPath windows/packaging/msix/store_identity.json `
            -Raw | ConvertFrom-Json
          $artifact = Get-Item -LiteralPath $env:WINDOWS_MSIX_PATH
          $metadata = [ordered]@{
            schemaVersion = 1
            platform = 'windows'
            distribution = 'microsoftStore'
            releaseId = $env:RELEASE_ID
            marketingVersion = $env:MARKETING_VERSION
            capturedAtUtc = [DateTimeOffset]::UtcNow.ToString('O')
            repository = $env:GITHUB_REPOSITORY
            commitSha = $env:CANDIDATE_SHA
            ref = $env:GITHUB_REF
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            buildNumber = $env:RELEASE_BUILD_NUMBER
            packageVersion = $env:MEETTRACE_MSIX_VERSION
            packageIdentity = $identity.identityName
            publisher = $identity.publisher
            publisherDisplayName = $identity.publisherDisplayName
            packageFamilyName = $identity.packageFamilyName
            storeId = $identity.storeId
            storeUri = $identity.storeUri
            storeUrl = $identity.storeUrl
            workflowFile = '.github/workflows/alpha-release.yml'
            job = 'windows'
            artifact = [ordered]@{
              name = $artifact.Name
              bytes = $artifact.Length
              sha256 = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              storeSubmissionCandidate = $true
              publiclyInstallable = $false
            }
          }
          $metadata | ConvertTo-Json -Depth 6 | Set-Content `
            -LiteralPath build/windows/msix/candidate-manifest.json `
            -Encoding utf8

      - name: Generate Windows candidate provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/windows/msix/*.msix

      - name: Upload Microsoft Store candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-windows-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/windows/msix/*.msix
            build/windows/msix/*.json
            build/windows/msix/*.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish:
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'metadata' ||
      needs.prepare.outputs.mode == 'resume' ||
      (needs.prepare.outputs.mode == 'candidate' &&
      needs.android.result == 'success' && needs.ios.result == 'success' &&
      needs.windows.result == 'success'))
    needs: [prepare, android, ios, windows]
    permissions:
      actions: read
      contents: write
    name: Approve and deploy public Alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: github-release
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Set up Flutter for update-manifest signing
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Resolve locked Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate release identity and public metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          TESTFLIGHT_URL: ${{ inputs.ios_testflight_external_url }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_MODE" == candidate || "$RELEASE_MODE" == resume || "$RELEASE_MODE" == metadata ]]
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git fetch --force origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
          [[ "$(git cat-file -t "refs/tags/$RELEASE_ID")" == tag ]]
          [[ "$(git rev-parse "refs/tags/$RELEASE_ID^{}")" == "$CANDIDATE_SHA" ]]
          marketing_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          [[ "$RELEASE_ID" == "v${marketing_version}-alpha."* ]]
          if [[ -n "$TESTFLIGHT_URL" ]]; then
            [[ "$TESTFLIGHT_URL" =~ ^https://testflight\.apple\.com/join/[A-Za-z0-9]+/?$ ]]
          fi

          release_json="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
          [[ "$(jq -r .tagName <<<"$release_json")" == "$RELEASE_ID" ]]
          [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]]
          if [[ "$RELEASE_MODE" == candidate || "$RELEASE_MODE" == resume ]]; then
            [[ "$(jq -r .isDraft <<<"$release_json")" == true ]]
          else
            [[ "$(jq -r .isDraft <<<"$release_json")" == false ]]
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"

      - name: Download candidate evidence from the verified run
        if: needs.prepare.outputs.mode == 'candidate' || needs.prepare.outputs.mode == 'resume'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == resume ]]; then
            source_run_id="$RESUME_RUN_ID"
          else
            source_run_id="$GITHUB_RUN_ID"
          fi
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]]

          source_run="$(
            gh run view "$source_run_id" --repo "$GITHUB_REPOSITORY" \
              --json workflowName,event,jobs
          )"
          jq -e '
            .workflowName == "Alpha Release" and
            .event == "workflow_dispatch" and
            ([.jobs[] | select(
              .name == "Build, sign, and stage Android Alpha" and
              .conclusion == "success"
            )] | length == 1) and
            ([.jobs[] | select(
              .name == "Build, sign, and upload iOS app" and
              .conclusion == "success"
            )] | length == 1) and
            ([.jobs[] | select(
              .name == "Build Microsoft Store Windows candidate" and
              .conclusion == "success"
            )] | length == 1)
          ' <<<"$source_run" >/dev/null || {
            echo "Source run did not complete all three release candidates successfully" >&2
            exit 1
          }

          mkdir -p build/finalize/android build/finalize/ios build/finalize/windows
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100")"
          select_artifact() {
            local prefix="$1"
            jq -r --arg prefix "$prefix" '
              [.artifacts[] | select(.expired == false and (.name | startswith($prefix)))]
              | sort_by(.created_at) | last | .id // empty
            ' <<<"$artifacts"
          }
          android_id="$(select_artifact meettrace-android-alpha-)"
          ios_id="$(select_artifact meettrace-ios-testflight-)"
          windows_id="$(select_artifact meettrace-windows-store-)"
          [[ "$android_id" =~ ^[0-9]+$ && "$ios_id" =~ ^[0-9]+$ && "$windows_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$android_id/zip" > build/finalize/android.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ios_id/zip" > build/finalize/ios.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$windows_id/zip" > build/finalize/windows.zip
          unzip -q build/finalize/android.zip -d build/finalize/android
          unzip -q build/finalize/ios.zip -d build/finalize/ios
          unzip -q build/finalize/windows.zip -d build/finalize/windows
          cp build/finalize/android/candidate-manifest.json build/finalize/android-candidate-manifest.json
          cp build/finalize/ios/candidate-manifest.json build/finalize/ios-candidate-manifest.json
          cp build/finalize/windows/candidate-manifest.json build/finalize/windows-candidate-manifest.json
          echo "SOURCE_RUN_ID=$source_run_id" >> "$GITHUB_ENV"

      - name: Download staged Android APK
        if: needs.prepare.outputs.mode == 'candidate' || needs.prepare.outputs.mode == 'resume'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/finalize/staged
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "meettrace-${RELEASE_ID}-android-arm64.apk" \
            --dir build/finalize/staged

      - name: Cross-check candidate manifests and staged APK
        if: needs.prepare.outputs.mode == 'candidate' || needs.prepare.outputs.mode == 'resume'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_apk="meettrace-${RELEASE_ID}-android-arm64.apk"
          release_assets="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json assets)"
          jq -e --arg apk "$expected_apk" '
            ([.assets[].name | select(ascii_downcase | endswith(".apk"))] == [$apk]) and
            ([.assets[].name | select(ascii_downcase | endswith(".ipa"))] | length == 0) and
            ([.assets[].name | select(ascii_downcase | endswith(".msix"))] | length == 0)
          ' <<<"$release_assets" >/dev/null
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("build/finalize")
          android = json.loads((root / "android-candidate-manifest.json").read_text())
          ios = json.loads((root / "ios-candidate-manifest.json").read_text())
          windows = json.loads((root / "windows-candidate-manifest.json").read_text(encoding="utf-8-sig"))
          expected_apk_name = f"meettrace-{os.environ['RELEASE_ID']}-android-arm64.apk"
          if android.get("artifact", {}).get("name") != expected_apk_name:
              raise SystemExit("Android candidate manifest has an unexpected APK name")
          expected = {
              "releaseId": os.environ["RELEASE_ID"],
              "marketingVersion": os.environ["MARKETING_VERSION"],
              "commitSha": os.environ["CANDIDATE_SHA"],
          }
          for name, manifest, platform, job in (
              ("Android", android, "android", "android"),
              ("iOS", ios, "ios", "ios"),
              ("Windows", windows, "windows", "windows"),
          ):
              for key, value in expected.items():
                  if str(manifest.get(key)) != value:
                      raise SystemExit(f"{name} {key} does not match the release")
              if (
                  manifest.get("platform") != platform
                  or manifest.get("workflowFile") != ".github/workflows/alpha-release.yml"
                  or manifest.get("job") != job
              ):
                  raise SystemExit(f"{name} candidate origin is invalid")
          if (
              android.get("packageIdentity") != "com.meettrace.app"
              or not re.fullmatch(
                  r"[0-9a-f]{64}",
                  str(android.get("signingIdentitySha256", "")),
              )
          ):
              raise SystemExit("Android candidate install identity is invalid")
          if not re.fullmatch(r"[1-9][0-9]*", str(android.get("runId", ""))):
              raise SystemExit("Android candidate run identity is invalid")
          if str(ios.get("runId")) != os.environ["SOURCE_RUN_ID"]:
              raise SystemExit("iOS candidate does not belong to the verified source run")
          if str(windows.get("runId")) != os.environ["SOURCE_RUN_ID"]:
              raise SystemExit("Windows candidate does not belong to the verified source run")
          build_numbers = {
              str(android.get("buildNumber")),
              str(ios.get("buildNumber")),
              str(windows.get("buildNumber")),
          }
          if len(build_numbers) != 1:
              raise SystemExit("Android, iOS, and Windows build numbers differ")
          if (
              windows.get("distribution") != "microsoftStore"
              or windows.get("packageIdentity") != "zhangheng2026.MeetTrace"
              or windows.get("publisher") != "CN=E5BC0A60-65F7-46C4-9A30-653FFCF9619B"
              or windows.get("publisherDisplayName") != "zhangheng2026"
              or windows.get("packageFamilyName") != "zhangheng2026.MeetTrace_vaaj3dqegb9y0"
              or windows.get("storeId") != "9PHHSJMWK06G"
              or windows.get("storeUri") != "ms-windows-store://pdp/?productid=9PHHSJMWK06G"
              or windows.get("storeUrl") != "https://apps.microsoft.com/detail/9PHHSJMWK06G"
          ):
              raise SystemExit("Windows candidate Store identity changed")
          expected_store_version = f"1.0.{windows.get('buildNumber')}.0"
          if windows.get("packageVersion") != expected_store_version:
              raise SystemExit("Windows Store package version mapping changed")

          apk = root / "staged" / android["artifact"]["name"]
          if not apk.is_file() or apk.stat().st_size != android["artifact"]["bytes"]:
              raise SystemExit("Staged Android APK size changed")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if digest != android["artifact"]["sha256"]:
              raise SystemExit("Staged Android APK digest changed")
          msix = root / "windows" / windows["artifact"]["name"]
          if not msix.is_file() or msix.stat().st_size != windows["artifact"]["bytes"]:
              raise SystemExit("Windows Store candidate size changed")
          if hashlib.sha256(msix.read_bytes()).hexdigest() != windows["artifact"]["sha256"]:
              raise SystemExit("Windows Store candidate digest changed")
          PY

      - name: Set up Microsoft Store CLI v0.4.0
        if: needs.prepare.outputs.mode == 'candidate' || needs.prepare.outputs.mode == 'resume'
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
        with:
          version: v0.4.0

      - name: Verify public Microsoft Store production submission
        if: needs.prepare.outputs.mode == 'candidate' || needs.prepare.outputs.mode == 'resume'
        shell: bash
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for name in \
            PARTNER_CENTER_TENANT_ID \
            PARTNER_CENTER_SELLER_ID \
            PARTNER_CENTER_CLIENT_ID \
            PARTNER_CENTER_CLIENT_SECRET; do
            value="${!name-}"
            [[ -n "${value//[[:space:]]/}" ]] || {
              echo "Missing protected github-release secret: $name" >&2
              exit 1
            }
          done

          msstore settings --enableTelemetry false
          msstore reconfigure \
            --tenantId "$PARTNER_CENTER_TENANT_ID" \
            --sellerId "$PARTNER_CENTER_SELLER_ID" \
            --clientId "$PARTNER_CENTER_CLIENT_ID" \
            --clientSecret "$PARTNER_CENTER_CLIENT_SECRET"

          raw_submission="$RUNNER_TEMP/meettrace-store-submission.json"
          trap 'rm -f -- "$raw_submission"' EXIT
          msstore submission get 9PHHSJMWK06G > "$raw_submission"
          expected_version="$(jq -er .packageVersion build/finalize/windows-candidate-manifest.json)"
          expected_artifact="$(jq -er .artifact.name build/finalize/windows-candidate-manifest.json)"
          dart run tool/release/verify_microsoft_store_submission.dart \
            --input "$raw_submission" \
            --output build/finalize/windows-store-production-receipt.json \
            --product-id 9PHHSJMWK06G \
            --expected-version "$expected_version" \
            --expected-artifact-name "$expected_artifact" \
            --release-id "$RELEASE_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --source-run-id "$SOURCE_RUN_ID" \
            --verified-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -f -- "$raw_submission"
          trap - EXIT

      - name: Remove Microsoft Store CLI credentials
        if: >-
          always() &&
          (needs.prepare.outputs.mode == 'candidate' ||
          needs.prepare.outputs.mode == 'resume')
        shell: bash
        run: |
          if command -v msstore >/dev/null 2>&1; then
            msstore reconfigure --reset
          fi

      - name: Upload Microsoft Store production receipt
        if: >-
          (needs.prepare.outputs.mode == 'candidate' ||
          needs.prepare.outputs.mode == 'resume') && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-windows-store-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/finalize/windows-store-production-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Validate immutable assets for a metadata-only update
        if: needs.prepare.outputs.mode == 'metadata'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_apk="meettrace-${RELEASE_ID}-android-arm64.apk"
          release_assets="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json assets)"
          jq -e --arg apk "$expected_apk" '
            ([.assets[].name | select(ascii_downcase | endswith(".apk"))] == [$apk]) and
            ([.assets[].name | select(ascii_downcase | endswith(".ipa"))] | length == 0) and
            ([.assets[].name | select(ascii_downcase | endswith(".msix"))] | length == 0)
          ' <<<"$release_assets" >/dev/null
          mkdir -p build/finalize/published
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "candidate-manifest.json" \
            --pattern "meettrace-${RELEASE_ID}-android-arm64.apk" \
            --dir build/finalize/published
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build/finalize/published")
          android = json.loads((root / "candidate-manifest.json").read_text())
          expected_apk_name = f"meettrace-{os.environ['RELEASE_ID']}-android-arm64.apk"
          if android.get("artifact", {}).get("name") != expected_apk_name:
              raise SystemExit("Existing public Android APK identity changed")
          if android.get("releaseId") != os.environ["RELEASE_ID"]:
              raise SystemExit("Existing public release evidence changed")
          if android.get("commitSha") != os.environ["CANDIDATE_SHA"]:
              raise SystemExit("Existing public release evidence changed")
          if android.get("marketingVersion") != os.environ["MARKETING_VERSION"]:
              raise SystemExit("Existing public release evidence changed")
          if (
              android.get("platform") != "android"
              or android.get("workflowFile") != ".github/workflows/alpha-release.yml"
              or android.get("job") != "android"
          ):
              raise SystemExit("Existing public release evidence changed")
          apk = root / android["artifact"]["name"]
          if not apk.is_file() or apk.stat().st_size != android["artifact"]["bytes"]:
              raise SystemExit("Existing public Android APK changed")
          if hashlib.sha256(apk.read_bytes()).hexdigest() != android["artifact"]["sha256"]:
              raise SystemExit("Existing public Android APK changed")
          PY

      - name: Prepare signed automatic-update pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          TESTFLIGHT_URL: ${{ inputs.ios_testflight_external_url }}
          WITHDRAW_UPDATE: ${{ inputs.withdraw_update }}
          APP_UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.APP_UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p build/finalize/update
          android_manifest="build/finalize/android-candidate-manifest.json"
          if [[ "$RELEASE_MODE" == metadata ]]; then
            android_manifest="build/finalize/published/candidate-manifest.json"
          fi
          [[ -s "$android_manifest" ]]
          build_number="$(jq -r '.buildNumber | tostring' "$android_manifest")"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          data_generation="$({
            sed -nE 's/^[[:space:]]*static const currentGeneration = ([1-9][0-9]*);/\1/p' \
              lib/data/services/storage/local_data_generation_gate.dart
          })"
          [[ "$data_generation" =~ ^[1-9][0-9]*$ ]]
          status=publicApproved
          if [[ "$WITHDRAW_UPDATE" == true ]]; then
            status=withdrawn
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/updates/alpha" \
              >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/heads/updates/alpha' -f sha="$CANDIDATE_SHA" >/dev/null
          fi

          previous_args=()
          previous_sha=""
          if current="$({
            gh api "repos/$GITHUB_REPOSITORY/contents/alpha.json?ref=updates%2Falpha"
          } 2>/dev/null)"; then
            previous_sha="$(jq -r .sha <<<"$current")"
            jq -r .content <<<"$current" | tr -d '\n' | base64 --decode \
              > build/finalize/update/previous-alpha.json
            previous_args=(--previous build/finalize/update/previous-alpha.json)
          fi
          echo "UPDATE_POINTER_PREVIOUS_SHA=$previous_sha" >> "$GITHUB_ENV"
          echo "UPDATE_POINTER_STATUS=$status" >> "$GITHUB_ENV"
          echo "UPDATE_POINTER_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          command=(
            dart run tool/release/create_signed_app_update_manifest.dart
            --status "$status"
            --release-id "$RELEASE_ID"
            --version-name "$MARKETING_VERSION"
            --build-number "$build_number"
            --data-generation "$data_generation"
            --source-sha "$CANDIDATE_SHA"
            --approved-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --repository "$GITHUB_REPOSITORY"
            --android-candidate "$android_manifest"
            --output build/finalize/update/alpha.json
          )
          if [[ -n "$TESTFLIGHT_URL" ]]; then
            command+=(--testflight-url "$TESTFLIGHT_URL")
          fi
          command+=("${previous_args[@]}")
          "${command[@]}"
          [[ -s build/finalize/update/alpha.json ]]

      - name: Remove redundant Release evidence assets
        if: needs.prepare.outputs.mode == 'candidate' || needs.prepare.outputs.mode == 'resume'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_assets="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json assets)"
          redundant_assets=(
            android-apk-inspection.json
            android-release-apk.sha256
            apksigner.txt
            signing-certificate.sha256
            android-candidate-manifest.json
            ios-candidate-manifest.json
          )
          for asset_name in "${redundant_assets[@]}"; do
            asset_url="$(
              jq -r --arg name "$asset_name" \
                '.assets[] | select(.name == $name) | .apiUrl' <<<"$release_assets"
            )"
            if [[ -n "$asset_url" ]]; then
              gh api --method DELETE "$asset_url"
              echo "Removed redundant Release asset: $asset_name"
            fi
          done

      - name: Write public release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          TESTFLIGHT_URL: ${{ inputs.ios_testflight_external_url }}
          WITHDRAW_UPDATE: ${{ inputs.withdraw_update }}
        run: |
          set -euo pipefail
          notes_path="$RUNNER_TEMP/public-release-notes.md"
          if [[ "$RELEASE_MODE" == metadata ]]; then
            gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes_path"
            NOTES_PATH="$notes_path" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["NOTES_PATH"])
          body = path.read_text(encoding="utf-8")
          url = os.environ.get("TESTFLIGHT_URL", "").strip()
          if url:
              replacement = f"- iOS TestFlight 外部测试链接：{url}"
              body, count = re.subn(r"^- iOS TestFlight 外部测试链接：.*$", replacement, body, flags=re.M)
              if count != 1:
                  raise SystemExit("Cannot locate the TestFlight link line in existing notes")
          extra = os.environ.get("RELEASE_NOTES", "").strip()
          if extra:
              body = re.sub(r"\n## 补充说明\n.*\Z", "", body, flags=re.S)
              body += f"\n\n## 补充说明\n\n{extra}\n"
          path.write_text(body, encoding="utf-8")
          PY
          else
            if [[ -n "$TESTFLIGHT_URL" ]]; then
              testflight_line="- iOS TestFlight 外部测试链接：$TESTFLIGHT_URL"
            else
              testflight_line="- iOS TestFlight 外部测试链接：待提供"
            fi
            {
              echo "MeetTrace \`$RELEASE_ID\` Alpha 已完成 Android、iOS 与 Windows 候选验收。"
              echo
              echo "- Android APK：本 Release 附件（仅 Android 7.0+、arm64-v8a）"
              echo "$testflight_line"
              echo "- Windows Microsoft Store：https://apps.microsoft.com/detail/9PHHSJMWK06G"
              echo "- 候选提交：\`$CANDIDATE_SHA\`"
              echo "- 候选流程：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
              echo "- 隐私政策：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$CANDIDATE_SHA/PRIVACY.md"
              echo
              echo "## Android 安装提示"
              echo
              echo "需要在系统设置中允许当前来源“安装未知应用”。应用无登录和云同步，数据只保存在本机；卸载应用会删除本机数据。Alpha 升级可能清除旧数据并重新下载模型，首次启动约下载 286.3 MB 运行资源。"
              echo
              echo "如版本被撤回，发布说明会标记“已撤回，不建议安装”，已有资产和标签仍保留。"
              if [[ -n "$RELEASE_NOTES" ]]; then
                echo
                echo "## 补充说明"
                echo
                printf '%s\n' "$RELEASE_NOTES"
              fi
            } > "$notes_path"
          fi
          if [[ "$WITHDRAW_UPDATE" == true ]]; then
            original="$(cat "$notes_path")"
            {
              echo "## 已撤回，不建议安装"
              echo
              echo "此版本已从应用内自动更新发现中撤回；标签和发布资产按审计要求保留。"
              echo
              printf '%s' "$original"
            } > "$notes_path"
          fi
          echo "PUBLIC_NOTES_PATH=$notes_path" >> "$GITHUB_ENV"

      - name: Publish verified draft or update public link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.prepare.outputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == candidate || "$RELEASE_MODE" == resume ]]; then
            gh release edit "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
              --title "MeetTrace $RELEASE_ID" \
              --notes-file "$PUBLIC_NOTES_PATH" \
              --draft=false --prerelease
          else
            gh release edit "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$PUBLIC_NOTES_PATH" --prerelease
          fi

      - name: Atomically publish signed automatic-update pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(base64 -w 0 build/finalize/update/alpha.json)"
          request="$(jq -n \
            --arg message "更新 Alpha 自动更新指针：$RELEASE_ID ($UPDATE_POINTER_STATUS)" \
            --arg content "$encoded" \
            --arg branch 'updates/alpha' \
            --arg sha "$UPDATE_POINTER_PREVIOUS_SHA" \
            '{message: $message, content: $content, branch: $branch}
             + if $sha == "" then {} else {sha: $sha} end')"
          jq -e . <<<"$request" >/dev/null
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/alpha.json" \
            --input - <<<"$request" > build/finalize/update/publish-response.json
          published="$({
            gh api "repos/$GITHUB_REPOSITORY/contents/alpha.json?ref=updates%2Falpha"
          })"
          jq -r .content <<<"$published" | tr -d '\n' | base64 --decode \
            > build/finalize/update/published-alpha.json
          cmp build/finalize/update/alpha.json build/finalize/update/published-alpha.json

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## Alpha release complete"
            echo
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Mode: \`${{ needs.prepare.outputs.mode }}\`"
            echo "- Update pointer: \`$UPDATE_POINTER_STATUS\` build \`$UPDATE_POINTER_BUILD_NUMBER\`"
            echo "- Windows Store ID: \`9PHHSJMWK06G\`"
            if [[ -s build/finalize/windows-store-production-receipt.json ]]; then
              echo "- Windows Store submission: \`$(jq -r .submissionId build/finalize/windows-store-production-receipt.json)\`"
              echo "- Windows Store status: \`$(jq -r .status build/finalize/windows-store-production-receipt.json)\` / \`$(jq -r .visibility build/finalize/windows-store-production-receipt.json)\`"
              echo "- Windows Store package: \`$(jq -r .package.version build/finalize/windows-store-production-receipt.json)\` \`x64\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
