name: Reusable Flutter Core Quality

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable commit or ref to validate
        required: true
        type: string
      build_android:
        description: Build and inspect the Android Debug APK
        required: false
        default: false
        type: boolean
permissions:
  contents: read

jobs:
  flutter-core:
    name: Flutter core quality and optional Android audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android Debug APK
        if: inputs.build_android
        run: flutter build apk --debug

      - name: Inspect Android Debug APK
        if: inputs.build_android
        shell: pwsh
        run: >-
          ./tool/benchmarks/inspect_debug_apk.ps1
          -ApkPath build/app/outputs/flutter-apk/app-debug.apk
          -ReportPath build/quality/android-apk-inspection.json
