name: Candidate Distribution Validation

on:
  repository_dispatch:
    types: [candidate-distribution-validation]

permissions: {}

concurrency:
  group: candidate-distribution-${{ github.event.client_payload.release_id }}-${{ github.event.client_payload.stage }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable candidate distribution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      android_artifact_name: ${{ steps.contract.outputs.android_artifact_name }}
      android_artifact_sha256: ${{ steps.contract.outputs.android_artifact_sha256 }}
      windows_artifact_name: ${{ steps.contract.outputs.windows_artifact_name }}
      windows_package_version: ${{ steps.contract.outputs.windows_package_version }}
      contract_artifact_name: ${{ steps.contract.outputs.contract_artifact_name }}
    env:
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      RECONCILE_RUN_ID: ${{ github.event.client_payload.reconcile_run_id }}
      CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
      VALIDATION_STAGE: ${{ github.event.client_payload.stage }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.candidate_sha }}
          fetch-depth: 0

      - name: Validate dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECONCILE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VALIDATION_STAGE" == flight || "$VALIDATION_STAGE" == production ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]]
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/master

      - name: Download candidate and reconciler evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,event,headSha,jobs)"
          jq -e --arg sha "$CANDIDATE_SHA" '
            .workflowName == "Alpha Release" and .event == "workflow_dispatch" and .headSha == $sha and
            ([.jobs[] | select(.name == "Build, sign, and stage Android Alpha" and .conclusion == "success")] | length == 1) and
            ([.jobs[] | select(.name == "Build, sign, and upload iOS app" and .conclusion == "success")] | length == 1) and
            ([.jobs[] | select(.name == "Build Microsoft Store Windows candidate" and .conclusion == "success")] | length == 1)
          ' <<<"$source_run" >/dev/null
          reconcile_run="$(gh run view "$RECONCILE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName,event,headBranch,status)"
          jq -e '
            .workflowName == "Alpha Release Reconciler" and
            (.event == "repository_dispatch" or .event == "schedule") and
            .headBranch == "master" and (.status == "in_progress" or .status == "completed")
          ' <<<"$reconcile_run" >/dev/null
          mkdir -p build/candidate-validation/{android,ios,windows,reconcile}
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          download_prefix() {
            local prefix="$1"
            local output="$2"
            local artifact_id
            artifact_id="$(jq -er --arg prefix "$prefix" '[.artifacts[] | select(.expired == false and (.name | startswith($prefix)))] | sort_by(.created_at, .id) | last | .id' <<<"$artifacts")"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$output.zip"
            unzip -q "$output.zip" -d "$output"
          }
          download_prefix meettrace-android-alpha- build/candidate-validation/android
          download_prefix meettrace-ios-testflight- build/candidate-validation/ios
          download_prefix meettrace-windows-store- build/candidate-validation/windows

          reconcile_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECONCILE_RUN_ID/artifacts?per_page=100")"
          reconcile_name="meettrace-reconcile-evidence-$RELEASE_ID"
          reconcile_id="$(jq -er --arg name "$reconcile_name" '[.artifacts[] | select(.expired == false and .name == $name)] | last | .id' <<<"$reconcile_artifacts")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$reconcile_id/zip" > build/candidate-validation/reconcile.zip
          unzip -q build/candidate-validation/reconcile.zip -d build/candidate-validation/reconcile

      - name: Build candidate distribution contract
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=build/candidate-validation
          android_manifest="$root/android/candidate-manifest.json"
          ios_manifest="$root/ios/candidate-manifest.json"
          windows_manifest="$root/windows/candidate-manifest.json"
          ios_receipt="$root/reconcile/testflight-production-receipt.json"
          if [[ "$VALIDATION_STAGE" == flight ]]; then
            store_receipt="$root/reconcile/windows-flight-receipt.json"
          else
            store_receipt="$root/reconcile/windows-store-production-receipt.json"
          fi
          for file in "$android_manifest" "$ios_manifest" "$windows_manifest" "$ios_receipt" "$store_receipt"; do
            [[ -s "$file" ]]
          done
          android_name="$(jq -er .artifact.name "$android_manifest")"
          android_sha="$(jq -er .artifact.sha256 "$android_manifest")"
          windows_name="$(jq -er .artifact.name "$windows_manifest")"
          windows_sha="$(jq -er .artifact.sha256 "$windows_manifest")"
          windows_version="$(jq -er .packageVersion "$windows_manifest")"
          build_number="$(jq -er .buildNumber "$windows_manifest")"
          for manifest in "$android_manifest" "$ios_manifest" "$windows_manifest"; do
            jq -e --arg release "$RELEASE_ID" --arg sha "$CANDIDATE_SHA" --argjson run "$SOURCE_RUN_ID" --arg build "$build_number" '
              .releaseId == $release and .commitSha == $sha and
              (.runId | tostring) == ($run | tostring) and
              (.buildNumber | tostring) == $build
            ' "$manifest" >/dev/null
          done
          jq -e --arg release "$RELEASE_ID" --arg sha "$CANDIDATE_SHA" --argjson run "$SOURCE_RUN_ID" '
            .distribution == "testFlightExternal" and .testing == true and
            .betaReviewState == "APPROVED" and .releaseId == $release and
            .candidateCommitSha == $sha and .sourceRunId == $run
          ' "$ios_receipt" >/dev/null
          jq -e --arg release "$RELEASE_ID" --arg sha "$CANDIDATE_SHA" --argjson run "$SOURCE_RUN_ID" --arg version "$windows_version" --arg name "$windows_name" '
            .releaseId == $release and .candidateCommitSha == $sha and
            .sourceRunId == $run and .status == "Published" and
            .package.version == $version and .package.fileName == $name and
            .package.architecture == "x64"
          ' "$store_receipt" >/dev/null
          apk="$root/android/$android_name"
          msix="$root/windows/$windows_name"
          [[ "$(sha256sum "$apk" | cut -d' ' -f1)" == "$android_sha" ]]
          [[ "$(sha256sum "$msix" | cut -d' ' -f1)" == "$windows_sha" ]]

          draft="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName)"
          jq -e --arg release "$RELEASE_ID" '.isDraft == true and .isPrerelease == true and .tagName == $release' <<<"$draft" >/dev/null

          jq -n \
            --arg releaseId "$RELEASE_ID" \
            --arg candidateCommitSha "$CANDIDATE_SHA" \
            --argjson sourceRunId "$SOURCE_RUN_ID" \
            --argjson reconcileRunId "$RECONCILE_RUN_ID" \
            --arg stage "$VALIDATION_STAGE" \
            --argjson buildNumber "$build_number" \
            --arg androidArtifactName "$android_name" \
            --arg androidArtifactSha256 "$android_sha" \
            --arg windowsArtifactName "$windows_name" \
            --arg windowsArtifactSha256 "$windows_sha" \
            --arg windowsPackageVersion "$windows_version" \
            '{schemaVersion: 1, releaseId: $releaseId, candidateCommitSha: $candidateCommitSha, sourceRunId: $sourceRunId, reconcileRunId: $reconcileRunId, stage: $stage, buildNumber: $buildNumber, android: {artifactName: $androidArtifactName, artifactSha256: $androidArtifactSha256}, windows: {artifactName: $windowsArtifactName, artifactSha256: $windowsArtifactSha256, packageVersion: $windowsPackageVersion}}' \
            > "$root/candidate-distribution-contract.json"
          artifact_name="meettrace-candidate-contract-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "android_artifact_name=$android_name" >> "$GITHUB_OUTPUT"
          echo "android_artifact_sha256=$android_sha" >> "$GITHUB_OUTPUT"
          echo "windows_artifact_name=$windows_name" >> "$GITHUB_OUTPUT"
          echo "windows_package_version=$windows_version" >> "$GITHUB_OUTPUT"
          echo "contract_artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload candidate distribution contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.contract.outputs.contract_artifact_name }}
          path: build/candidate-validation/candidate-distribution-contract.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  android_candidate_install:
    name: Validate candidate APK on Firebase ARM64
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: meet-trace
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      DEVICE_MODEL: MediumPhone.arm
      ANDROID_VERSION: "35"
      ANDROID_ARTIFACT_NAME: ${{ needs.resolve.outputs.android_artifact_name }}
      ANDROID_ARTIFACT_SHA256: ${{ needs.resolve.outputs.android_artifact_sha256 }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          version: "580.0.0"

      - name: Download immutable Draft APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/candidate-validation/android
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ANDROID_ARTIFACT_NAME" --dir build/candidate-validation/android
          apk="build/candidate-validation/android/$ANDROID_ARTIFACT_NAME"
          echo "$ANDROID_ARTIFACT_SHA256  $apk" | sha256sum --check --strict

      - name: Install and launch candidate on Firebase Test Lab ARM64
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --type robo \
            --app "build/candidate-validation/android/$ANDROID_ARTIFACT_NAME" \
            --device "model=$DEVICE_MODEL,version=$ANDROID_VERSION,locale=en,orientation=portrait" \
            --no-resign \
            --timeout 10m \
            --client-details "matrixLabel=meettrace-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --results-history-name meettrace-candidate-distribution \
            2>&1 | tee build/candidate-validation/android/gcloud-output.txt
          jq -n --arg releaseId "$RELEASE_ID" --arg artifactName "$ANDROID_ARTIFACT_NAME" --arg artifactSha256 "$ANDROID_ARTIFACT_SHA256" --arg deviceModel "$DEVICE_MODEL" --arg androidVersion "$ANDROID_VERSION" \
            '{schemaVersion: 1, validation: "candidateInstallAndLaunch", releaseId: $releaseId, artifactName: $artifactName, artifactSha256: $artifactSha256, architecture: "arm64-v8a", deviceModel: $deviceModel, androidVersion: $androidVersion, noResign: true, passed: true}' \
            > build/candidate-validation/android/receipt.json

      - name: Upload Android candidate validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-candidate-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate-validation/android/
          if-no-files-found: error
          retention-days: 30

  windows_store:
    name: Validate Microsoft Store candidate lifecycle
    needs: resolve
    runs-on: [self-hosted, Windows, X64, meettrace-store]
    timeout-minutes: 30
    environment: windows-store-validation
    permissions:
      actions: read
      contents: read
    env:
      MEETTRACE_DEDICATED_STORE_VALIDATION: "1"
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      WINDOWS_PACKAGE_VERSION: ${{ needs.resolve.outputs.windows_package_version }}
      VALIDATION_STAGE: ${{ github.event.client_payload.stage }}
    steps:
      - name: Checkout validated master workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate dedicated runner and Store lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or
              $env:GITHUB_EVENT_NAME -cne 'repository_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Candidate Store validation requires the dedicated master runner.'
          }
          ./tool/windows/validate_store_distribution.ps1 `
            -Mode InstallUninstall `
            -ReleaseId $env:RELEASE_ID `
            -ExpectedVersion $env:WINDOWS_PACKAGE_VERSION `
            -ReceiptPath build/candidate-validation/windows/store-lifecycle-receipt.json

      - name: Upload Windows Store lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-candidate-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/candidate-validation/windows/store-lifecycle-receipt.json
          if-no-files-found: error
          retention-days: 90

  validation_gate:
    name: Confirm candidate distribution validation
    needs: [resolve, android_candidate_install, windows_store]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      RECONCILE_RUN_ID: ${{ github.event.client_payload.reconcile_run_id }}
      CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
      VALIDATION_STAGE: ${{ github.event.client_payload.stage }}
    steps:
      - name: Record immutable candidate distribution gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/candidate-validation/gate
          jq -n --arg releaseId "$RELEASE_ID" --arg candidateCommitSha "$CANDIDATE_SHA" --argjson sourceRunId "$SOURCE_RUN_ID" --argjson reconcileRunId "$RECONCILE_RUN_ID" --argjson validationRunId "$GITHUB_RUN_ID" --arg stage "$VALIDATION_STAGE" --arg validatedAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1, validation: "candidateDistribution", releaseId: $releaseId, candidateCommitSha: $candidateCommitSha, sourceRunId: $sourceRunId, reconcileRunId: $reconcileRunId, validationRunId: $validationRunId, stage: $stage, androidFirebaseArm: "passed", windowsStoreLifecycle: "passed", validatedAtUtc: $validatedAtUtc}' \
            > build/candidate-validation/gate/receipt.json

      - name: Upload candidate distribution gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-candidate-distribution-${{ env.VALIDATION_STAGE }}-${{ env.RELEASE_ID }}
          path: build/candidate-validation/gate/receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Resume release reconciliation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            --method POST \
            -f event_type=alpha-release-reconcile \
            -F "client_payload[release_id]=$RELEASE_ID" \
            -F "client_payload[source_run_id]=$SOURCE_RUN_ID" \
            -F "client_payload[candidate_sha]=$CANDIDATE_SHA"

  report_failure:
    name: Report candidate distribution failure
    if: >-
      always() &&
      (needs.resolve.result != 'success' ||
      needs.android_candidate_install.result != 'success' ||
      needs.windows_store.result != 'success' ||
      needs.validation_gate.result != 'success')
    needs: [resolve, android_candidate_install, windows_store, validation_gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
      VALIDATION_STAGE: ${{ github.event.client_payload.stage }}
    steps:
      - name: Create or update release-blocked issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          gh label create release-blocked --repo "$GITHUB_REPOSITORY" --color B60205 --description "External release state blocks automatic publication" --force
          title="[release-blocked] $RELEASE_ID"
          body="$(printf '候选真实分发验证失败。Draft Release 和旧更新指针保持不变。\n\n- Stage: `%s`\n- Candidate: `%s`\n- Validation run: %s' "$VALIDATION_STAGE" "$CANDIDATE_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $title" --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -1 || true)"
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body "$body" --add-label release-blocked
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label release-blocked
          fi
