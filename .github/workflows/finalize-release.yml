name: Finalize Alpha Release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Version identifier such as v1.0.0-alpha.1
        required: true
        type: string
      ios_testflight_external_url:
        description: Optional approved TestFlight external testing URL
        required: false
        type: string
      release_notes:
        description: Optional public Alpha release notes
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: alpha-release-finalize
  cancel-in-progress: false

jobs:
  finalize-alpha-release:
    name: Verify candidates and publish GitHub prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-release

    steps:
      - name: Validate release identifier
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]

      - name: Checkout candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_id }}
          fetch-depth: 0

      - name: Validate release identity and uniqueness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          marketing_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          expected_prefix="v${marketing_version}-alpha."
          [[ "$RELEASE_ID" == "$expected_prefix"* ]]

          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_ID" >/dev/null
          git fetch --force origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_ID")"
          candidate_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_ID")"
          [[ "$tag_type" == "tag" ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$candidate_sha" ]]
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$candidate_sha" origin/master

          visibility="$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)"
          [[ "$visibility" == "PUBLIC" ]]

          if ! gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Android candidate Draft Release $RELEASE_ID does not exist" >&2
            exit 1
          fi
          release_metadata="$(
            gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName
          )"
          jq -e --arg tag "$RELEASE_ID" '
            .isPrerelease == true and
            .tagName == $tag
          ' <<< "$release_metadata" >/dev/null
          release_is_draft="$(jq -r .isDraft <<< "$release_metadata")"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "RELEASE_IS_DRAFT=$release_is_draft" >> "$GITHUB_ENV"

      - name: Resolve candidate workflow runs from the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pointer_dir="build/release/candidate-pointers"
          mkdir -p "$pointer_dir"
          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-manifest.json \
            --dir "$pointer_dir"
          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern ios-candidate-manifest.json \
            --dir "$pointer_dir"

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          pointer_dir = Path("build/release/candidate-pointers")
          candidates = (
              (
                  "android",
                  pointer_dir / "candidate-manifest.json",
                  ".github/workflows/android-alpha.yml",
                  "ANDROID_RUN_ID",
              ),
              (
                  "ios",
                  pointer_dir / "ios-candidate-manifest.json",
                  ".github/workflows/ios-testflight.yml",
                  "IOS_RUN_ID",
              ),
          )
          resolved = {}
          for platform, path, workflow_file, env_name in candidates:
              if not path.is_file():
                  raise SystemExit(f"Missing {platform} candidate pointer: {path}")
              manifest = json.loads(path.read_text(encoding="utf-8"))
              expected = {
                  "platform": platform,
                  "releaseId": os.environ["RELEASE_ID"],
                  "commitSha": os.environ["CANDIDATE_SHA"],
                  "marketingVersion": os.environ["MARKETING_VERSION"],
                  "workflowFile": workflow_file,
                  "gateDecision": "go",
              }
              for key, value in expected.items():
                  if manifest.get(key) != value:
                      raise SystemExit(
                          f"{platform} candidate pointer {key} mismatch: "
                          f"{manifest.get(key)!r} != {value!r}"
                      )
              run_id = str(manifest.get("runId", ""))
              if not re.fullmatch(r"[1-9][0-9]*", run_id):
                  raise SystemExit(f"{platform} candidate pointer has an invalid run ID")
              resolved[env_name] = run_id

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for name, value in resolved.items():
                  stream.write(f"{name}={value}\n")
          PY

      - name: Validate candidate workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ANDROID_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$IOS_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p build/release/run-metadata

          validate_run() {
            local run_id="$1"
            local expected_path="$2"
            local expected_head_sha="$3"
            local output="$4"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$output"
            jq -e --arg sha "$expected_head_sha" --arg path "$expected_path" '
              .status == "completed" and
              .conclusion == "success" and
              .event == "workflow_dispatch" and
              ($sha == "" or .head_sha == $sha) and
              .path == $path
            ' "$output" >/dev/null
          }

          validate_run "$ANDROID_RUN_ID" ".github/workflows/android-alpha.yml" "$CANDIDATE_SHA" \
            build/release/run-metadata/android-run.json
          validate_run "$IOS_RUN_ID" ".github/workflows/ios-testflight.yml" "" \
            build/release/run-metadata/ios-run.json

      - name: Download non-sensitive candidate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download_candidate() {
            local run_id="$1"
            local prefix="$2"
            local destination="$3"
            local artifact_name
            artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq ".artifacts | map(select((.expired | not) and (.name | startswith(\"$prefix\")))) | sort_by(.created_at) | last | .name")"
            [[ -n "$artifact_name" && "$artifact_name" != "null" ]]
            mkdir -p "$destination"
            gh run download "$run_id" --name "$artifact_name" --dir "$destination"
          }

          download_candidate "$ANDROID_RUN_ID" "meettrace-android-alpha-$ANDROID_RUN_ID-" \
            build/release/android
          download_candidate "$IOS_RUN_ID" "meettrace-ios-testflight-$IOS_RUN_ID-" \
            build/release/ios

      - name: Download the staged Android APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_apk_name="meettrace-${RELEASE_ID}-android-arm64.apk"
          release_assets="$(
            gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json assets
          )"
          jq -e --arg name "$expected_apk_name" '
            [.assets[] | select(.name | endswith(".apk"))] as $apks |
            ($apks | length) == 1 and $apks[0].name == $name
          ' <<< "$release_assets" >/dev/null
          mkdir -p build/release/android-apk
          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$expected_apk_name" \
            --dir build/release/android-apk

      - name: Cross-check candidate manifests and product gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          def unique(root: str, name: str) -> Path:
              matches = list(Path(root).rglob(name))
              if len(matches) != 1:
                  raise SystemExit(f"Expected one {name} under {root}, found {len(matches)}")
              return matches[0]

          expected = {
              "releaseId": os.environ["RELEASE_ID"],
              "commitSha": os.environ["CANDIDATE_SHA"],
              "marketingVersion": os.environ["MARKETING_VERSION"],
              "gateDecision": "go",
          }
          inputs = (
              ("android", "build/release/android", os.environ["ANDROID_RUN_ID"]),
              ("ios", "build/release/ios", os.environ["IOS_RUN_ID"]),
          )
          final = Path("build/release/final")
          final.mkdir(parents=True, exist_ok=True)
          manifests = {}
          for platform, root, run_id in inputs:
              manifest_path = unique(root, "candidate-manifest.json")
              gate_path = unique(root, "release-gate-report.json")
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              gate = json.loads(gate_path.read_text(encoding="utf-8"))
              for key, value in expected.items():
                  if manifest.get(key) != value:
                      raise SystemExit(
                          f"{platform} manifest {key} mismatch: {manifest.get(key)!r} != {value!r}"
                      )
              if manifest.get("platform") != platform or str(manifest.get("runId")) != run_id:
                  raise SystemExit(f"{platform} manifest workflow identity mismatch")
              if gate.get("decision") != "go":
                  raise SystemExit(f"{platform} product gate is not go")
              manifests[platform] = manifest
              shutil.copy2(manifest_path, final / f"{platform}-candidate-manifest.json")
              shutil.copy2(gate_path, final / f"{platform}-release-gate-report.json")

          apk_name = f"meettrace-{os.environ['RELEASE_ID']}-android-arm64.apk"
          apk_path = unique("build/release/android-apk", apk_name)
          apk = manifests["android"].get("artifact", {})
          if apk.get("name") != apk_name:
              raise SystemExit("Android APK name does not match the candidate manifest")
          if apk.get("bytes") != apk_path.stat().st_size:
              raise SystemExit("Android APK size does not match the candidate manifest")
          digest = hashlib.sha256(apk_path.read_bytes()).hexdigest()
          if apk.get("sha256") != digest:
              raise SystemExit("Android APK digest does not match the candidate manifest")
          distribution = manifests["android"].get("distribution", {})
          if distribution != {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "visibility": "public-after-finalize",
              "releaseState": "draft",
              "publiclyInstallable": False,
          }:
              raise SystemExit("Android candidate distribution contract mismatch")
          PY

      - name: Write public release notes
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          IOS_TESTFLIGHT_EXTERNAL_URL: ${{ inputs.ios_testflight_external_url }}
        run: |
          set -euo pipefail
          if [[ -n "$IOS_TESTFLIGHT_EXTERNAL_URL" && ! "$IOS_TESTFLIGHT_EXTERNAL_URL" =~ ^https://testflight\.apple\.com/join/[A-Za-z0-9]+$ ]]; then
            echo "ios_testflight_external_url must be an official TestFlight external testing URL" >&2
            exit 1
          fi
          notes_path="build/release/final/release-notes.md"
          {
            echo "# MeetTrace $RELEASE_ID"
            echo
            echo "Android 与 iOS 已基于同一提交完成 Alpha 候选验收。"
            echo
            echo "## 安装入口"
            echo
            echo "- Android：下载本 Release 附件 \`meettrace-${RELEASE_ID}-android-arm64.apk\`。"
            if [[ -n "$IOS_TESTFLIGHT_EXTERNAL_URL" ]]; then
              echo "- iOS TestFlight 外部测试：$IOS_TESTFLIGHT_EXTERNAL_URL"
            else
              echo "- iOS TestFlight 外部测试链接：待提供。"
            fi
            echo
            echo "## 安装与数据提示"
            echo
            echo "- Android 仅支持 Android 7.0+ 的 \`arm64-v8a\` 设备。"
            echo "- 安装 APK 前，需要允许浏览器或文件管理器“安装未知应用”。"
            echo "- 本 Alpha 无登录和云同步，会议数据只保存在本机。"
            echo "- 卸载应用会删除全部本地会议和模型数据。"
            echo "- Alpha 升级可能清除旧数据，并要求重新下载模型。"
            echo "- 首次启动需要下载约 286.3 MB 运行资源，完整校验后才能进入首页。"
            echo "- 严重问题版本会标记“已撤回，不建议安装”但保留下载与审计记录；修复使用新版本向前发布。"
            echo
            echo "## 验收追踪"
            echo
            echo "- Source commit: \`$CANDIDATE_SHA\`"
            echo "- Android candidate run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ANDROID_RUN_ID"
            echo "- iOS TestFlight run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$IOS_RUN_ID"
            echo "- Product gate: \`go\`"
            if [[ -n "$RELEASE_NOTES" ]]; then
              echo
              echo "## 其他说明"
              echo
              printf '%s\n' "$RELEASE_NOTES"
            fi
          } > "$notes_path"

      - name: Publish the verified draft as a GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            build/release/final/android-candidate-manifest.json
            build/release/final/android-release-gate-report.json
            build/release/final/ios-candidate-manifest.json
            build/release/final/ios-release-gate-report.json
          )
          if [[ "$RELEASE_IS_DRAFT" == "true" ]]; then
            gh release upload "$RELEASE_ID" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            mkdir -p build/release/existing-public-evidence
            download_args=()
            for asset in "${assets[@]}"; do
              download_args+=(--pattern "$(basename "$asset")")
            done
            gh release download "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              "${download_args[@]}" \
              --dir build/release/existing-public-evidence
            for asset in "${assets[@]}"; do
              published="build/release/existing-public-evidence/$(basename "$asset")"
              if ! cmp --silent "$asset" "$published"; then
                echo "Existing public release evidence changed: $(basename "$asset")" >&2
                exit 1
              fi
            done
          fi

          expected_apk_name="meettrace-${RELEASE_ID}-android-arm64.apk"
          current_assets="$(
            gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json assets
          )"
          jq -e --arg name "$expected_apk_name" '
            [.assets[] | select(.name | endswith(".apk"))] as $apks |
            ($apks | length) == 1 and $apks[0].name == $name
          ' <<< "$current_assets" >/dev/null
          mkdir -p build/release/prepublish-apk
          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$expected_apk_name" \
            --dir build/release/prepublish-apk
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("build/release/final/android-candidate-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          apk = Path("build/release/prepublish-apk") / manifest["artifact"]["name"]
          if not apk.is_file():
              raise SystemExit("Staged Android APK disappeared before publication")
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if apk.stat().st_size != manifest["artifact"]["bytes"]:
              raise SystemExit("Staged Android APK size changed before publication")
          if digest != manifest["artifact"]["sha256"]:
              raise SystemExit("Staged Android APK digest changed before publication")
          PY

          if [[ "$RELEASE_IS_DRAFT" == "true" ]]; then
            gh release edit "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease \
              --verify-tag \
              --title "MeetTrace $RELEASE_ID" \
              --notes-file build/release/final/release-notes.md
          else
            gh release edit "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --verify-tag \
              --title "MeetTrace $RELEASE_ID" \
              --notes-file build/release/final/release-notes.md
          fi

      - name: Write release summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_url="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          {
            echo "## Alpha prerelease published"
            echo
            echo "- Release: [$RELEASE_ID]($release_url)"
            echo "- Commit: \`$CANDIDATE_SHA\`"
            echo "- Android APK: \`meettrace-${RELEASE_ID}-android-arm64.apk\`"
            echo "- iOS IPA: TestFlight only, not attached"
          } >> "$GITHUB_STEP_SUMMARY"
