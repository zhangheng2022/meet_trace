name: Platform Distribution Validation

on:
  repository_dispatch:
    types: [platform-distribution-validation]

permissions: {}

concurrency:
  group: platform-distribution-validation
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable public distribution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      build_number: ${{ steps.contract.outputs.build_number }}
      marketing_version: ${{ steps.contract.outputs.marketing_version }}
      source_commit_sha: ${{ steps.contract.outputs.source_commit_sha }}
      windows_package_version: ${{ steps.contract.outputs.windows_package_version }}
      windows_artifact_sha256: ${{ steps.contract.outputs.windows_artifact_sha256 }}
      android_artifact_name: ${{ steps.contract.outputs.android_artifact_name }}
      android_artifact_sha256: ${{ steps.contract.outputs.android_artifact_sha256 }}
      ios_source_artifact_name: ${{ steps.source_artifacts.outputs.ios_artifact_name }}
      windows_source_artifact_name: ${{ steps.source_artifacts.outputs.windows_artifact_name }}
      contract_artifact_name: ${{ steps.contract.outputs.contract_artifact_name }}
    env:
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      PREVIOUS_ANDROID_RELEASE_ID: ${{ github.event.client_payload.previous_android_release_id }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      PUBLISH_RUN_ID: ${{ github.event.client_payload.publish_run_id }}
      WINDOWS_VALIDATION_MODE: ${{ github.event.client_payload.windows_validation_mode }}
      WINDOWS_PREVIOUS_VERSION: ${{ github.event.client_payload.windows_previous_version }}

    steps:
      - name: Checkout requested master commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate repository dispatch on master
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/master" ]]
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$PREVIOUS_ANDROID_RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_ID" != "$PREVIOUS_ANDROID_RELEASE_ID" ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ "$WINDOWS_VALIDATION_MODE" == "Update" ]]; then
            [[ "$WINDOWS_PREVIOUS_VERSION" =~ ^1\.0\.[1-9][0-9]*\.0$ ]]
          else
            [[ "$WINDOWS_VALIDATION_MODE" == "InstallUninstall" ]]
            [[ -z "$WINDOWS_PREVIOUS_VERSION" ]]
          fi

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Set up Java 17 for APK inspection
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Download public release and latest source evidence
        id: source_artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p \
            build/distribution/current \
            build/distribution/previous \
            build/distribution/source/ios \
            build/distribution/source/windows \
            build/distribution/source/production

          current_apk="meettrace-${RELEASE_ID}-android-arm64.apk"
          current_release="$(
            gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets
          )"
          jq -e --arg apk "$current_apk" '
            .isDraft == false and .isPrerelease == true and
            ([.assets[].name] | sort) == (["candidate-manifest.json", $apk] | sort)
          ' <<<"$current_release" >/dev/null
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-manifest.json --pattern "$current_apk" \
            --dir build/distribution/current

          previous_release="$(
            gh release view "$PREVIOUS_ANDROID_RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,assets
          )"
          jq -e '
            .isDraft == false and .isPrerelease == true and
            ([.assets[].name | select(ascii_downcase | endswith(".apk"))] | length == 1) and
            ([.assets[].name | select(. == "candidate-manifest.json")] | length == 1) and
            ([.assets[].name | select(ascii_downcase | endswith(".ipa") or endswith(".msix"))] | length == 0)
          ' <<<"$previous_release" >/dev/null
          gh release download "$PREVIOUS_ANDROID_RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-manifest.json --pattern "*.apk" \
            --dir build/distribution/previous

          source_artifacts="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100"
          )"
          publish_artifacts="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID/artifacts?per_page=100"
          )"
          select_artifact() {
            local artifacts="$1"
            local prefix="$2"
            jq -cer --arg prefix "$prefix" '
              [.artifacts[] | select(
                .expired == false and (.name | startswith($prefix))
              )]
              | sort_by(.created_at, .id)
              | last // error("matching unexpired artifact was not found")
            ' <<<"$artifacts"
          }
          download_artifact() {
            local artifact="$1"
            local destination="$2"
            local archive="$RUNNER_TEMP/artifact-$(jq -r .id <<<"$artifact").zip"
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$(jq -r .id <<<"$artifact")/zip" \
              > "$archive"
            unzip -q "$archive" -d "$destination"
          }

          ios_artifact="$(
            select_artifact "$source_artifacts" \
              "meettrace-ios-testflight-${SOURCE_RUN_ID}-"
          )"
          windows_artifact="$(
            select_artifact "$source_artifacts" \
              "meettrace-windows-store-${SOURCE_RUN_ID}-"
          )"
          production_artifact="$(
            select_artifact "$publish_artifacts" \
              "meettrace-windows-store-production-${PUBLISH_RUN_ID}-"
          )"
          ios_artifact_name="$(jq -r .name <<<"$ios_artifact")"
          windows_artifact_name="$(jq -r .name <<<"$windows_artifact")"
          production_artifact_name="$(jq -r .name <<<"$production_artifact")"
          [[ "$ios_artifact_name" =~ ^meettrace-ios-testflight-${SOURCE_RUN_ID}-[1-9][0-9]*$ ]]
          [[ "$windows_artifact_name" =~ ^meettrace-windows-store-${SOURCE_RUN_ID}-[1-9][0-9]*$ ]]
          [[ "$production_artifact_name" =~ ^meettrace-windows-store-production-${PUBLISH_RUN_ID}-[1-9][0-9]*$ ]]
          download_artifact "$ios_artifact" build/distribution/source/ios
          download_artifact "$windows_artifact" build/distribution/source/windows
          download_artifact "$production_artifact" build/distribution/source/production
          echo "ios_artifact_name=$ios_artifact_name" >> "$GITHUB_OUTPUT"
          echo "windows_artifact_name=$windows_artifact_name" >> "$GITHUB_OUTPUT"

          [[ -s build/distribution/source/ios/candidate-manifest.json ]]
          [[ -s build/distribution/source/windows/candidate-manifest.json ]]
          [[ -s build/distribution/source/production/windows-store-production-receipt.json ]]
          cp build/distribution/source/ios/candidate-manifest.json \
            build/distribution/ios-candidate-manifest.json
          cp build/distribution/source/windows/candidate-manifest.json \
            build/distribution/windows-candidate-manifest.json
          cp build/distribution/source/production/windows-store-production-receipt.json \
            build/distribution/windows-store-production-receipt.json

          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -f ref=updates/alpha \
            "repos/$GITHUB_REPOSITORY/contents/alpha.json" \
            --jq .content | tr -d '\n' | base64 --decode \
            > build/distribution/alpha.json

      - name: Verify signed public update and platform candidates
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/release/verify_public_update.dart \
            --envelope build/distribution/alpha.json \
            --android-candidate build/distribution/current/candidate-manifest.json \
            --ios-candidate build/distribution/ios-candidate-manifest.json \
            --windows-candidate build/distribution/windows-candidate-manifest.json \
            --windows-production-receipt build/distribution/windows-store-production-receipt.json \
            --release-id "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$SOURCE_RUN_ID" \
            --publish-run-id "$PUBLISH_RUN_ID" \
            --output build/distribution/public-update-receipt.json

      - name: Verify source, publish run, and Android signing lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,event,conclusion,headSha,jobs \
            > build/distribution/source-run.json
          gh run view "$PUBLISH_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,workflowName,event,conclusion,headSha,jobs \
            > build/distribution/publish-run.json
          jq -e \
            --argjson run "$SOURCE_RUN_ID" \
            --arg sha "$(jq -r .sourceCommitSha build/distribution/public-update-receipt.json)" '
            .databaseId == $run and
            .workflowName == "Alpha Release" and
            .event == "workflow_dispatch" and
            .headSha == $sha and
            ([.jobs[] | select(.name == "Build, sign, and stage Android Alpha" and .conclusion == "success")] | length == 1) and
            ([.jobs[] | select(.name == "Build, sign, and upload iOS app" and .conclusion == "success")] | length == 1) and
            ([.jobs[] | select(.name == "Build Microsoft Store Windows candidate" and .conclusion == "success")] | length == 1)
          ' build/distribution/source-run.json >/dev/null
          jq -e \
            --argjson run "$PUBLISH_RUN_ID" '
            .databaseId == $run and
            .workflowName == "Alpha Release" and
            .event == "workflow_dispatch" and
            .conclusion == "success" and
            ([.jobs[] | select(.name == "Approve and deploy public Alpha" and .conclusion == "success")] | length == 1)
          ' build/distribution/publish-run.json >/dev/null
          [[ "$(git cat-file -t "$RELEASE_ID")" == "tag" ]]
          tag_commit="$(git rev-list -n 1 "$RELEASE_ID")"
          source_commit="$(jq -r .sourceCommitSha build/distribution/public-update-receipt.json)"
          [[ "$tag_commit" == "$source_commit" ]]

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$sdk_root" && -d "$sdk_root/build-tools" ]]
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [[ -x "$build_tools/aapt" && -x "$build_tools/apksigner" ]]
          current_apk="$(find build/distribution/current -maxdepth 1 -type f -name '*.apk')"
          previous_apk="$(find build/distribution/previous -maxdepth 1 -type f -name '*.apk')"
          [[ -n "$current_apk" && -n "$previous_apk" ]]
          "$build_tools/aapt" dump badging "$current_apk" \
            > build/distribution/current-apk-badging.txt
          "$build_tools/aapt" dump badging "$previous_apk" \
            > build/distribution/previous-apk-badging.txt
          "$build_tools/apksigner" verify --print-certs "$current_apk" \
            > build/distribution/current-apk-signing.txt
          "$build_tools/apksigner" verify --print-certs "$previous_apk" \
            > build/distribution/previous-apk-signing.txt

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("build/distribution")
          current = json.loads((root / "current/candidate-manifest.json").read_text(encoding="utf-8-sig"))
          previous = json.loads((root / "previous/candidate-manifest.json").read_text(encoding="utf-8-sig"))
          receipt = json.loads((root / "public-update-receipt.json").read_text(encoding="utf-8-sig"))
          windows = json.loads((root / "windows-candidate-manifest.json").read_text(encoding="utf-8-sig"))

          def one_file(directory: Path, suffix: str) -> Path:
              files = list(directory.glob(f"*{suffix}"))
              if len(files) != 1:
                  raise SystemExit(f"Expected exactly one {suffix} in {directory}")
              return files[0]

          def verify_file(path: Path, artifact: dict) -> None:
              if path.name != artifact.get("name") or path.stat().st_size != artifact.get("bytes"):
                  raise SystemExit(f"Artifact identity changed: {path}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != artifact.get("sha256"):
                  raise SystemExit(f"Artifact digest changed: {path}")

          current_apk = one_file(root / "current", ".apk")
          previous_apk = one_file(root / "previous", ".apk")
          windows_msix = one_file(root / "source/windows", ".msix")
          verify_file(current_apk, current["artifact"])
          verify_file(previous_apk, previous["artifact"])
          verify_file(windows_msix, windows["artifact"])

          if previous.get("schemaVersion") not in (1, 2) or previous.get("platform") != "android":
              raise SystemExit("Previous Android manifest schema is invalid")
          if previous.get("releaseId") != os.environ["PREVIOUS_ANDROID_RELEASE_ID"]:
              raise SystemExit("Previous Android release identity changed")
          if int(previous.get("buildNumber", 0)) >= int(current.get("buildNumber", 0)):
              raise SystemExit("Previous Android build is not older")
          if receipt["android"]["sha256"] != current["artifact"]["sha256"]:
              raise SystemExit("Public Android receipt digest changed")

          package_pattern = re.compile(
              r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",
              re.MULTILINE,
          )
          signing_pattern = re.compile(
              r"^(?:Signer #\d+|V\d+ Signer:) certificate SHA-256 digest: ([0-9a-fA-F]{64})$",
              re.MULTILINE,
          )
          android_arm64_version_code_offset = 2000

          def expected_version_code(manifest: dict, label: str) -> tuple[int, int | None]:
              schema_version = int(manifest.get("schemaVersion", 0))
              shared_build_number = int(manifest.get("buildNumber", 0))
              if schema_version == 1:
                  return shared_build_number + android_arm64_version_code_offset, None
              if schema_version == 2:
                  android_base_build_number = int(
                      manifest.get("androidBaseBuildNumber", 0)
                  )
                  declared_version_code = int(manifest.get("versionCode", 0))
                  if (
                      android_base_build_number <= 0
                      or declared_version_code
                      != android_base_build_number + android_arm64_version_code_offset
                      or declared_version_code != shared_build_number
                  ):
                      raise SystemExit(
                          f"{label} Android arm64 split versionCode mapping is invalid"
                      )
                  return declared_version_code, android_base_build_number
              raise SystemExit(f"{label} Android candidate schema is unsupported")

          apk_identities = []
          for label in ("current", "previous"):
              badging = (root / f"{label}-apk-badging.txt").read_text()
              signing = (root / f"{label}-apk-signing.txt").read_text()
              package_match = package_pattern.search(badging)
              signing_digests = {
                  match.lower() for match in signing_pattern.findall(signing)
              }
              if package_match is None or len(signing_digests) != 1:
                  raise SystemExit(f"Cannot parse {label} APK identity")
              apk_identities.append(
                  {
                      "packageIdentity": package_match.group(1),
                      "versionCode": int(package_match.group(2)),
                      "versionName": package_match.group(3),
                      "signingIdentitySha256": next(iter(signing_digests)),
                  }
              )
          current_identity, previous_identity = apk_identities
          if current_identity["packageIdentity"] != "com.meettrace.app" or previous_identity["packageIdentity"] != "com.meettrace.app":
              raise SystemExit("Android APK package identity changed")
          if current_identity["versionName"] != current.get("marketingVersion") or previous_identity["versionName"] != previous.get("marketingVersion"):
              raise SystemExit("Android APK marketing version differs from candidate manifest")
          current_expected_version_code, current_android_base_build_number = (
              expected_version_code(current, "Current")
          )
          previous_expected_version_code, previous_android_base_build_number = (
              expected_version_code(previous, "Previous")
          )
          if (
              current_identity["versionCode"] != current_expected_version_code
              or previous_identity["versionCode"] != previous_expected_version_code
          ):
              raise SystemExit("Android APK version code differs from the arm64 split candidate build")
          if current_identity["signingIdentitySha256"] != current["signingIdentitySha256"] or previous_identity["signingIdentitySha256"] != current["signingIdentitySha256"]:
              raise SystemExit("Android signing lineage changed")
          if previous.get("packageIdentity") not in (None, "com.meettrace.app"):
              raise SystemExit("Previous Android manifest package identity changed")
          if previous.get("signingIdentitySha256") not in (None, current["signingIdentitySha256"]):
              raise SystemExit("Previous Android manifest signing identity changed")

          lineage = {
              "schemaVersion": 1,
              "currentReleaseId": current["releaseId"],
              "currentBuildNumber": int(current["buildNumber"]),
              "currentVersionCode": current_identity["versionCode"],
              "currentAndroidBaseBuildNumber": current_android_base_build_number,
              "previousReleaseId": previous["releaseId"],
              "previousBuildNumber": int(previous["buildNumber"]),
              "previousVersionCode": previous_identity["versionCode"],
              "previousAndroidBaseBuildNumber": previous_android_base_build_number,
              "arm64VersionCodeOffset": android_arm64_version_code_offset,
              "packageIdentity": current_identity["packageIdentity"],
              "signingIdentitySha256": current_identity["signingIdentitySha256"],
          }
          (root / "android-signing-lineage-receipt.json").write_text(
              json.dumps(lineage, indent=2) + "\n"
          )
          PY

      - name: Export validated contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          receipt=build/distribution/public-update-receipt.json
          {
            echo "build_number=$(jq -r .buildNumber "$receipt")"
            echo "marketing_version=$(jq -r .versionName "$receipt")"
            echo "source_commit_sha=$(jq -r .sourceCommitSha "$receipt")"
            echo "windows_package_version=$(jq -r .windows.packageVersion "$receipt")"
            echo "windows_artifact_sha256=$(jq -r .windows.artifactSha256 "$receipt")"
            echo "android_artifact_name=$(jq -r .android.artifactName "$receipt")"
            echo "android_artifact_sha256=$(jq -r .android.sha256 "$receipt")"
            echo "contract_artifact_name=platform-distribution-contract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload public distribution contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-distribution-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/distribution/public-update-receipt.json
            build/distribution/android-signing-lineage-receipt.json
            build/distribution/source-run.json
            build/distribution/publish-run.json
            build/distribution/ios-candidate-manifest.json
            build/distribution/windows-candidate-manifest.json
            build/distribution/windows-store-production-receipt.json
          if-no-files-found: error
          retention-days: 90

  android_public_install:
    name: Validate public Android install and update lineage
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: meet-trace
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      DEVICE_MODEL: ${{ github.event.client_payload.android_device_model || 'MediumPhone.arm' }}
      ANDROID_VERSION: ${{ github.event.client_payload.android_version || '35' }}
      ANDROID_ARTIFACT_NAME: ${{ needs.resolve.outputs.android_artifact_name }}
      ANDROID_ARTIFACT_SHA256: ${{ needs.resolve.outputs.android_artifact_sha256 }}
      CONTRACT_ARTIFACT_NAME: ${{ needs.resolve.outputs.contract_artifact_name }}

    steps:
      - name: Validate Firebase configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ -n "$WORKLOAD_IDENTITY_PROVIDER" ]]
          [[ -n "$SERVICE_ACCOUNT" ]]
          [[ "$DEVICE_MODEL" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$ANDROID_VERSION" =~ ^[1-9][0-9]*$ ]]

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          install_components: alpha
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          version: "580.0.0"

      - name: Download immutable public APK and contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/platform-validation/android build/platform-validation/contract
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ANDROID_ARTIFACT_NAME" \
            --dir build/platform-validation/android
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CONTRACT_ARTIFACT_NAME" \
            --dir build/platform-validation/contract
          apk="build/platform-validation/android/$ANDROID_ARTIFACT_NAME"
          [[ -s "$apk" ]]
          echo "$ANDROID_ARTIFACT_SHA256  $apk" \
            | sha256sum --check --strict

      - name: Validate Firebase ARM device
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android models describe "$DEVICE_MODEL" \
            --project "$FIREBASE_PROJECT_ID" --format=json \
            > build/platform-validation/android/device-model.json
          jq -e --arg version "$ANDROID_VERSION" \
            '(.supportedVersionIds | index($version) != null) and
             (.supportedAbis | index("arm64-v8a") != null)' \
            build/platform-validation/android/device-model.json >/dev/null

      - name: Install and launch public APK on Firebase Test Lab ARM64
        id: firebase-test
        shell: bash
        run: |
          set +e
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --type robo \
            --app "build/platform-validation/android/$ANDROID_ARTIFACT_NAME" \
            --device "model=$DEVICE_MODEL,version=$ANDROID_VERSION,locale=en,orientation=portrait" \
            --no-resign \
            --timeout 10m \
            --client-details "matrixLabel=meettrace-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --results-history-name meettrace-public-distribution \
            2>&1 | tee build/platform-validation/android/gcloud-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          results_uri="$(
            sed -nE \
              's#^Raw results will be stored in your GCS bucket at \[https://console\.developers\.google\.com/storage/browser/([^]]+)/\]$#gs://\1#p' \
              build/platform-validation/android/gcloud-output.txt | tail -n 1
          )"
          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
          echo "results_uri=$results_uri" >> "$GITHUB_OUTPUT"
          exit "$test_exit_code"

      - name: Collect Firebase raw results
        if: always() && steps.firebase-test.outputs.results_uri != ''
        continue-on-error: true
        shell: bash
        env:
          RESULTS_URI: ${{ steps.firebase-test.outputs.results_uri }}
        run: |
          mkdir -p build/platform-validation/android/raw-results
          gcloud storage rsync --recursive "$RESULTS_URI" \
            build/platform-validation/android/raw-results

      - name: Write Android validation receipt
        if: always()
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.firebase-test.outputs.exit_code }}
          RESULTS_URI: ${{ steps.firebase-test.outputs.results_uri }}
        run: |
          jq -n \
            --arg releaseId "$RELEASE_ID" \
            --arg artifactName "$ANDROID_ARTIFACT_NAME" \
            --arg artifactSha256 "$ANDROID_ARTIFACT_SHA256" \
            --arg deviceModel "$DEVICE_MODEL" \
            --arg androidVersion "$ANDROID_VERSION" \
            --arg resultsUri "$RESULTS_URI" \
            --arg exitCode "${TEST_EXIT_CODE:-not-run}" \
            '{schemaVersion: 1, validation: "publicInstallAndLaunch", releaseId: $releaseId,
              artifactName: $artifactName, artifactSha256: $artifactSha256,
              architecture: "arm64-v8a", deviceModel: $deviceModel,
              androidVersion: $androidVersion, noResign: true,
              resultsUri: $resultsUri, exitCode: $exitCode}' \
            > build/platform-validation/android/receipt.json

      - name: Upload Android public install evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-public-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/platform-validation/android/device-model.json
            build/platform-validation/android/gcloud-output.txt
            build/platform-validation/android/raw-results/
            build/platform-validation/android/receipt.json
          if-no-files-found: error
          retention-days: 30

  ios_testflight_evidence:
    name: Validate TestFlight submission evidence
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      IOS_SOURCE_ARTIFACT_NAME: ${{ needs.resolve.outputs.ios_source_artifact_name }}
      CONTRACT_ARTIFACT_NAME: ${{ needs.resolve.outputs.contract_artifact_name }}

    steps:
      - name: Download immutable contract and TestFlight evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/platform-validation/ios build/platform-validation/contract
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$CONTRACT_ARTIFACT_NAME" \
            --dir build/platform-validation/contract
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$IOS_SOURCE_ARTIFACT_NAME" \
            --dir build/platform-validation/ios

      - name: Verify TestFlight candidate without exposing IPA
        shell: bash
        run: |
          set -euo pipefail
          if find build/platform-validation/ios -type f -iname '*.ipa' | grep -q .; then
            echo "iOS evidence must not contain IPA." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("build/platform-validation")
          manifests = list((root / "ios").rglob("candidate-manifest.json"))
          receipts = list((root / "contract").rglob("public-update-receipt.json"))
          if len(manifests) != 1 or len(receipts) != 1:
              raise SystemExit("Expected one iOS manifest and one public contract")
          manifest = json.loads(manifests[0].read_text(encoding="utf-8-sig"))
          contract = json.loads(receipts[0].read_text(encoding="utf-8-sig"))
          expected = {
              "schemaVersion": 1,
              "platform": "ios",
              "releaseId": os.environ["RELEASE_ID"],
              "marketingVersion": contract["versionName"],
              "buildNumber": str(contract["buildNumber"]),
              "commitSha": contract["sourceCommitSha"],
              "runId": os.environ["SOURCE_RUN_ID"],
              "bundleId": "com.meettrace.app",
              "workflowFile": ".github/workflows/alpha-release.yml",
              "job": "ios",
          }
          for key, value in expected.items():
              if str(manifest.get(key)) != str(value):
                  raise SystemExit(f"iOS {key} changed")
          artifact = manifest.get("artifact", {})
          if artifact.get("distributionSigned") is not True or artifact.get("testFlightUploadCandidate") is not True:
              raise SystemExit("iOS artifact is not a signed TestFlight candidate")
          receipt = {
              "schemaVersion": 1,
              "validation": "testFlightSubmissionEvidence",
              "releaseId": os.environ["RELEASE_ID"],
              "sourceRunId": int(os.environ["SOURCE_RUN_ID"]),
              "bundleId": "com.meettrace.app",
              "buildNumber": contract["buildNumber"],
              "installUri": contract["ios"]["installUri"],
              "ipaExposed": False,
          }
          (root / "ios/receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Upload TestFlight distribution evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-testflight-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/platform-validation/ios/
          if-no-files-found: error
          retention-days: 30

  windows_store:
    name: Validate Microsoft Store install lifecycle
    needs: resolve
    runs-on: [self-hosted, Windows, X64, meettrace-store]
    timeout-minutes: 30
    environment: windows-store-validation
    permissions:
      contents: read
      actions: read
    env:
      MEETTRACE_DEDICATED_STORE_VALIDATION: "1"
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      WINDOWS_SOURCE_ARTIFACT_NAME: ${{ needs.resolve.outputs.windows_source_artifact_name }}
      CONTRACT_ARTIFACT_NAME: ${{ needs.resolve.outputs.contract_artifact_name }}
      WINDOWS_VALIDATION_MODE: ${{ github.event.client_payload.windows_validation_mode }}
      WINDOWS_PREVIOUS_VERSION: ${{ github.event.client_payload.windows_previous_version }}
      WINDOWS_PACKAGE_VERSION: ${{ needs.resolve.outputs.windows_package_version }}

    steps:
      - name: Checkout validated master workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate dedicated runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'self-hosted') {
            throw 'Microsoft Store validation requires a self-hosted runner.'
          }
          if ($env:GITHUB_EVENT_NAME -cne 'repository_dispatch' -or
              $env:GITHUB_REF -cne 'refs/heads/master') {
            throw 'Microsoft Store validation requires repository_dispatch on master.'
          }
          if ($null -eq (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI is required on the dedicated runner.'
          }

      - name: Download immutable contract and Windows source evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force `
            -Path build/platform-validation/contract | Out-Null
          New-Item -ItemType Directory -Force `
            -Path build/platform-validation/windows | Out-Null
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name $env:CONTRACT_ARTIFACT_NAME `
            --dir build/platform-validation/contract
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download public contract.' }
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY `
            --name $env:WINDOWS_SOURCE_ARTIFACT_NAME `
            --dir build/platform-validation/windows
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download Windows evidence.' }

      - name: Revalidate Windows candidate bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $contractFiles = @(Get-ChildItem build/platform-validation/contract `
            -Recurse -Filter public-update-receipt.json)
          $manifestFiles = @(Get-ChildItem build/platform-validation/windows `
            -Recurse -Filter candidate-manifest.json)
          $msixFiles = @(Get-ChildItem build/platform-validation/windows `
            -Recurse -Filter *.msix)
          if ($contractFiles.Count -ne 1 -or $manifestFiles.Count -ne 1 -or
              $msixFiles.Count -ne 1) {
            throw 'Expected one public contract, Windows manifest, and MSIX.'
          }
          $contract = Get-Content $contractFiles[0].FullName -Raw | ConvertFrom-Json
          $manifest = Get-Content $manifestFiles[0].FullName -Raw | ConvertFrom-Json
          $msix = $msixFiles[0]
          $digest = (Get-FileHash $msix.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.releaseId -cne $env:RELEASE_ID -or
              $manifest.commitSha -cne $contract.sourceCommitSha -or
              $manifest.packageVersion -cne $contract.windows.packageVersion -or
              $manifest.packageIdentity -cne 'zhangheng2026.MeetTrace' -or
              $manifest.storeId -cne '9PHHSJMWK06G' -or
              $manifest.artifact.name -cne $msix.Name -or
              [int64]$manifest.artifact.bytes -ne $msix.Length -or
              $manifest.artifact.sha256 -cne $digest -or
              $contract.windows.artifactSha256 -cne $digest) {
            throw 'Windows source candidate differs from the public contract.'
          }

      - name: Validate Store package install, launch, and removal
        shell: pwsh
        run: |
          ./tool/windows/validate_store_distribution.ps1 `
            -Mode $env:WINDOWS_VALIDATION_MODE `
            -ReleaseId $env:RELEASE_ID `
            -ExpectedVersion $env:WINDOWS_PACKAGE_VERSION `
            -PreviousVersion $env:WINDOWS_PREVIOUS_VERSION `
            -ReceiptPath build/platform-validation/windows/store-lifecycle-receipt.json

      - name: Upload Windows Store lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-store-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/platform-validation/windows/store-lifecycle-receipt.json
          if-no-files-found: warn
          retention-days: 90

  validation_gate:
    name: Confirm platform distribution validation
    needs: [resolve, android_public_install, ios_testflight_evidence, windows_store]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      RELEASE_ID: ${{ github.event.client_payload.release_id }}
      SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      PUBLISH_RUN_ID: ${{ github.event.client_payload.publish_run_id }}
    steps:
      - name: Record complete validation
        shell: bash
        run: |
          {
            echo '## Platform distribution validation passed'
            echo
            echo '- Public signed update contract: verified'
            echo '- Android public arm64-v8a install and launch: verified'
            echo '- iOS signed TestFlight submission evidence: verified'
            echo '- Windows Store install lifecycle: verified on the dedicated runner'
            echo "- Release: \`$RELEASE_ID\`"
            echo "- Source run: \`$SOURCE_RUN_ID\`"
            echo "- Publish run: \`$PUBLISH_RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"
