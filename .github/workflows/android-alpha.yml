name: Android Alpha Candidate

on:
  workflow_call:
    inputs:
      release_id:
        description: Version identifier such as v1.0.0-alpha.1
        required: true
        type: string
      release_notes:
        description: Optional notes kept on the draft until final publication
        required: false
        type: string
      candidate_sha:
        description: Immutable candidate commit resolved by Alpha Release
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-android-alpha:
    name: Build, sign, and stage Android Alpha
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: android-alpha

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Validate candidate identity
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$candidate_sha" == "$CANDIDATE_SHA" ]]
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$candidate_sha" origin/master

          marketing_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          [[ -n "$marketing_version" ]]
          expected_prefix="v${marketing_version}-alpha."
          [[ "$RELEASE_ID" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_ID" == "$expected_prefix"* ]]

          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare release build number
        shell: bash
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_ATTEMPT > 99 )); then
            echo "GitHub run attempt exceeds the supported build-number range" >&2
            exit 1
          fi
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "ANDROID_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Android versionCode: $build_number"

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "${ANDROID_KEYSTORE_BASE64//[[:space:]]/}" ]]
          keystore_path="$RUNNER_TEMP/meettrace-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          [[ -s "$keystore_path" ]]
          chmod 600 "$keystore_path"
          echo "MEETTRACE_ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed Android Release APK
        shell: bash
        env:
          MEETTRACE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEETTRACE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEETTRACE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name="$MARKETING_VERSION" \
            --build-number="$ANDROID_BUILD_NUMBER"
          source_apk="build/app/outputs/flutter-apk/app-release.apk"
          apk_path="build/android/alpha/meettrace-${RELEASE_ID}-android-arm64.apk"
          [[ -s "$source_apk" ]]
          mkdir -p "$(dirname "$apk_path")"
          mv -- "$source_apk" "$apk_path"
          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"

      - name: Inspect APK contents
        shell: pwsh
        run: |
          ./tool/benchmarks/inspect_debug_apk.ps1 `
            -ApkPath $env:APK_PATH `
            -ReportPath build/android/alpha/android-apk-inspection.json
          $report = Get-Content -LiteralPath build/android/alpha/android-apk-inspection.json -Raw |
            ConvertFrom-Json
          $abis = @($report.abis)
          if ($abis.Count -ne 1 -or $abis[0] -ne 'arm64-v8a') {
            throw "Public Alpha APK must contain only arm64-v8a; found: $($abis -join ', ')"
          }

      - name: Verify APK signature and certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p build/android/alpha
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          [[ -x "$apksigner" ]]
          "$apksigner" verify --verbose --print-certs "$APK_PATH" \
            | tee build/android/alpha/apksigner.txt
          actual="$(sed -nE 's/^Signer #1 certificate SHA-256 digest: (.*)$/\1/p' build/android/alpha/apksigner.txt | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$actual" && -n "$expected" && "$actual" == "$expected" ]]
          printf '%s\n' "$actual" > build/android/alpha/signing-certificate.sha256
          sha256sum "$APK_PATH" | tee build/android/alpha/android-release-apk.sha256

      - name: Write Android candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ID="$RELEASE_ID" \
          MARKETING_VERSION="$MARKETING_VERSION" \
          ANDROID_BUILD_NUMBER="$ANDROID_BUILD_NUMBER" \
          APK_PATH="$APK_PATH" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path(os.environ["APK_PATH"])
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          manifest = {
              "schemaVersion": 1,
              "platform": "android",
              "releaseId": os.environ["RELEASE_ID"],
              "marketingVersion": os.environ["MARKETING_VERSION"],
              "buildNumber": os.environ["ANDROID_BUILD_NUMBER"],
              "commitSha": os.environ["CANDIDATE_SHA"],
              "workflowFile": ".github/workflows/android-alpha.yml",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifact": {"name": apk.name, "bytes": apk.stat().st_size, "sha256": digest},
              "distribution": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "visibility": "public-after-finalize",
                  "releaseState": "draft",
                  "publiclyInstallable": False,
              },
          }
          Path("build/android/alpha/candidate-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate APK provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.APK_PATH }}

      - name: Stage APK in this repository's draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          visibility="$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)"
          [[ "$visibility" == "PUBLIC" ]]
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_ID" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_ID:refs/tags/$RELEASE_ID"
            [[ "$(git cat-file -t "refs/tags/$RELEASE_ID")" == "tag" ]]
            [[ "$(git rev-parse "refs/tags/$RELEASE_ID^{}")" == "$CANDIDATE_SHA" ]]
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_ID" "$CANDIDATE_SHA" -m "MeetTrace $RELEASE_ID candidate"
            git push origin "refs/tags/$RELEASE_ID"
          fi

          notes_path="$RUNNER_TEMP/android-release-notes.md"
          {
            echo "MeetTrace Android candidate \`$RELEASE_ID\` (not publicly installable yet)."
            echo
            echo "Source: \`$GITHUB_REPOSITORY@$CANDIDATE_SHA\`"
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "This Draft Release must remain unpublished until the matching iOS TestFlight candidate passes final verification."
            if [[ -n "$RELEASE_NOTES" ]]; then
              echo
              printf '%s\n' "$RELEASE_NOTES"
            fi
          } > "$notes_path"

          if release_json="$(gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease 2>/dev/null)"; then
            [[ "$(jq -r .isDraft <<<"$release_json")" == true ]]
            [[ "$(jq -r .isPrerelease <<<"$release_json")" == true ]]
            gh release edit "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" \
              --title "MeetTrace $RELEASE_ID Android candidate" --notes-file "$notes_path"
          else
            gh release create "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft --prerelease \
              --title "MeetTrace $RELEASE_ID Android candidate" \
              --notes-file "$notes_path"
          fi

          gh release upload "$RELEASE_ID" \
            "$APK_PATH" \
            build/android/alpha/android-release-apk.sha256 \
            build/android/alpha/signing-certificate.sha256 \
            build/android/alpha/candidate-manifest.json \
            build/android/alpha/android-apk-inspection.json \
            build/android/alpha/apksigner.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload non-sensitive Android candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meettrace-android-alpha-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/android/alpha/*.json
            build/android/alpha/*.sha256
            build/android/alpha/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove temporary signing materials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MEETTRACE_ANDROID_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$MEETTRACE_ANDROID_KEYSTORE_PATH"
          fi
