name: Firebase Test Lab

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: Firebase Test Lab Android device model
        required: true
        default: MediumPhone.arm
        type: string
      android_version:
        description: Firebase Test Lab Android version ID
        required: true
        default: "35"
        type: string

permissions: {}

concurrency:
  group: firebase-test-lab-master
  cancel-in-progress: false

jobs:
  firebase-test-lab:
    name: Patrol ${{ matrix.patrol.name }} on Firebase Test Lab
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        patrol:
          - name: harness-smoke
            target: patrol_test/harness_smoke_test.dart
          - name: meeting-list-smoke
            target: patrol_test/meeting_list_smoke_test.dart
          - name: microphone-permission-recovery
            target: patrol_test/microphone_permission_recovery_test.dart
          - name: meeting-golden-path
            target: patrol_test/meeting_golden_path_test.dart
          - name: recording-continuity
            target: patrol_test/recording_continuity_test.dart
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: meet-trace
      DEVICE_MODEL: ${{ inputs.device_model }}
      ANDROID_VERSION: ${{ inputs.android_version }}
      PATROL_NAME: ${{ matrix.patrol.name }}
      PATROL_TARGET: ${{ matrix.patrol.target }}

    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate manual master run
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "This workflow only supports workflow_dispatch." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Select the master branch when starting this workflow." >&2
            exit 1
          fi

      - name: Validate Firebase configuration
        shell: bash
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          [[ -n "$WORKLOAD_IDENTITY_PROVIDER" ]] || { echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER repository variable." >&2; exit 1; }
          [[ -n "$SERVICE_ACCOUNT" ]] || { echo "Missing GCP_SERVICE_ACCOUNT repository variable." >&2; exit 1; }
          [[ -n "$DEVICE_MODEL" ]] || { echo "device_model must not be empty." >&2; exit 1; }
          [[ -n "$ANDROID_VERSION" ]] || { echo "android_version must not be empty." >&2; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      - name: Validate Firebase device
        shell: bash
        run: |
          mkdir -p build/firebase-test-lab
          gcloud firebase test android models describe "$DEVICE_MODEL" \
            --project "$FIREBASE_PROJECT_ID" \
            --format=json > build/firebase-test-lab/device-model.json
          jq -e --arg version "$ANDROID_VERSION" \
            '.supportedVersionIds | index($version) != null' \
            build/firebase-test-lab/device-model.json > /dev/null || {
              echo "Android version $ANDROID_VERSION is not supported by $DEVICE_MODEL." >&2
              jq -r '.supportedVersionIds[]' build/firebase-test-lab/device-model.json >&2
              exit 1
            }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli 4.6.1

      - name: Build Firebase instrumentation APKs
        shell: bash
        run: |
          patrol build android \
            --target "$PATROL_TARGET" \
            --debug
          app_apk=build/app/outputs/apk/debug/app-debug.apk
          test_apk=build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          [[ -s "$app_apk" ]] || { echo "Missing $app_apk" >&2; exit 1; }
          [[ -s "$test_apk" ]] || { echo "Missing $test_apk" >&2; exit 1; }
          sha256sum "$app_apk" "$test_apk" \
            > build/firebase-test-lab/apk-sha256.txt

      - name: Run Patrol on Firebase Test Lab
        id: firebase-test
        shell: bash
        run: |
          set +e
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --type instrumentation \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device "model=$DEVICE_MODEL,version=$ANDROID_VERSION,locale=en,orientation=portrait" \
            --timeout 45m \
            --client-details "matrixLabel=meettrace-${PATROL_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --results-history-name meettrace-patrol-master \
            2>&1 | tee build/firebase-test-lab/gcloud-output.txt
          test_exit_code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
          exit "$test_exit_code"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Firebase Test Lab: $PATROL_NAME"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Device: \`$DEVICE_MODEL\` / Android \`$ANDROID_VERSION\`"
            echo "- Test: \`$PATROL_TARGET\`"
            echo "- Test exit code: \`${{ steps.firebase-test.outputs.exit_code || 'not-run' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Firebase run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: firebase-test-lab-${{ matrix.patrol.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/firebase-test-lab/apk-sha256.txt
            build/firebase-test-lab/device-model.json
            build/firebase-test-lab/gcloud-output.txt
          if-no-files-found: warn
          retention-days: 14
