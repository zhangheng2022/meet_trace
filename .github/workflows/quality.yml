name: Flutter Quality

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-quality:
    name: Flutter quality and Android package audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ".fvmrc"
          cache: true

      - name: Capture toolchain snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/quality
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit_sha=$GITHUB_SHA"
            flutter --version
            dart --version 2>&1
            java -version 2>&1
          } | tee build/quality/toolchain.txt

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Inspect Android Debug APK
        shell: pwsh
        run: >-
          ./tool/benchmarks/inspect_debug_apk.ps1
          -ApkPath build/app/outputs/flutter-apk/app-debug.apk
          -ReportPath build/quality/android-apk-inspection.json

      - name: Write APK checksum
        shell: bash
        run: >-
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
          > build/quality/android-debug-apk.sha256

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meettrace-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/quality/*.json
            build/quality/*.sha256
            build/quality/*.txt
          if-no-files-found: warn
          retention-days: 7
